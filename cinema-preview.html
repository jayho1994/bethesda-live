<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>畢士大 · 電影場景</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c100f;color:#f3e6ce;font:16px/1.6 system-ui}#frame{position:relative;width:100%;aspect-ratio:16/9;max-height:100vh;overflow:hidden;background:#171b19}#poolWorld,#poolWorld video,#poolWorld img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#poolWorld video{visibility:hidden}#poolWorld video.cinema-on{visibility:visible}nav{position:relative;z-index:10;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 20px;background:#141b18}button,select{font:inherit;padding:7px 12px;color:#f3e6ce;background:#253128;border:1px solid #9d8968;border-radius:3px;cursor:pointer}#worldNotice{position:absolute;z-index:9;top:18px;left:18px;max-width:85%;padding:12px;background:#162019ed;border:1px solid #a89169}#worldNotice button{margin-left:10px}#worldNotice[hidden]{display:none}#status{padding:0 20px;color:#b6b8aa;font-size:14px}h1{font:18px/1.5 serif;margin:0 12px 0 0}.note{margin:12px 20px;font-size:14px;color:#bebdad}
</style></head><body><nav><h1>畢士大 · 電影場景</h1><button id="prev">上一個場景</button><select id="scene" aria-label="場景"><option value="title">鳥瞰 · 羊門與雙池</option><option value="R1">少年 · 課室</option><option value="R2">大學 · 閱讀露台</option><option value="R3">初職 · 辦公室</option><option value="R4">建立 · 家庭</option><option value="R5">風暴 · 廊下</option><option value="R6">回望 · 池邊</option></select><button id="next">下一個場景</button><button id="motion" aria-pressed="false">暫停動態</button></nav><div id="frame"></div><p id="status">依次按「下一個場景」可觀看相連過場。此頁不會操作遊戲。</p><p class="note">電影以每秒 24 格播放。此頁使用適合網上播放的 1080p 版本；4K 母片另存於完整交付。跳往非相鄰場景會直接載入該場景。</p><script src="cinema.js?r6=20260923-2"></script><script>
const select=document.getElementById('scene');const go=()=>window.PoolWorld.go(select.value);select.onchange=go;document.getElementById('next').onclick=()=>{select.selectedIndex=Math.min(6,select.selectedIndex+1);go();};document.getElementById('prev').onclick=()=>{select.selectedIndex=Math.max(0,select.selectedIndex-1);go();};document.getElementById('motion').onclick=e=>{const q=e.target.getAttribute('aria-pressed')!=='true';e.target.setAttribute('aria-pressed',String(q));e.target.textContent=q?'恢復動態':'暫停動態';window.PoolWorld.quiet(q);};document.addEventListener('keydown',e=>{if(e.target.matches('select,button'))return;if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click();});
</script></body></html>
