<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<title>站長入分 · 畢士大版</title><meta name="game-release" content="B1-C1-R10">
<style>
  :root{--paper:#F0EEE6;--card:rgba(255,254,250,.86);--ink:#141413;--ink2:#3D3D3A;--muted:#6B6963;--faint:#A8A59D;
    --clay:#D97757;--clay-deep:#9E4529;--gold:#C9962B;--red:#BE5A4C;--line:rgba(20,20,19,.11);--line2:rgba(20,20,19,.06);
    --serif:"Cormorant Garamond","Songti TC","Noto Serif CJK TC",serif;--cjk:"Songti TC","Noto Serif CJK TC","Noto Serif TC","PingFang TC",serif;
    --ui:-apple-system,"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;font-family:var(--ui);color:var(--ink);
  background-color:#F0EEE6;
  background-image:
    linear-gradient(90deg,rgba(240,238,230,.55) 0%,rgba(240,238,230,.86) 45%,rgba(240,238,230,.96) 100%),
    url('art/passage.png');
  background-size:cover,cover,cover;background-position:left center;background-attachment:fixed;}
  header{padding:14px;text-align:center;border-bottom:1px solid var(--line);background:rgba(240,238,230,.6);backdrop-filter:blur(6px)}
  header h1{margin:0;font-size:20px;letter-spacing:.14em;font-family:var(--cjk);font-weight:600} header .sub{color:var(--muted);font-size:12.5px;margin-top:4px;font-family:var(--cjk)}
  .cfg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px}
  .cfg select,.cfg button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;font-family:var(--ui);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 2px 0 rgba(20,20,19,.06)}
  .searchbar{display:flex;gap:8px;padding:4px 14px 0;align-items:center}
  .searchbar input{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:17px;font-family:inherit;-webkit-appearance:none}
  .searchbar input:focus{outline:none;border-color:var(--clay)}
  .searchbar .clr{background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:15px}
  .qhint{padding:7px 16px 0;font-size:12.5px;color:var(--muted);min-height:18px;font-family:var(--serif)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px;padding-bottom:70px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;user-select:none;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 3px 0 rgba(20,20,19,.08),0 6px 14px rgba(20,20,19,.07);transition:transform .09s}
  .tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 0 0 rgba(20,20,19,.08),0 2px 6px rgba(20,20,19,.08)}
  .tile.hit{border-color:var(--clay);box-shadow:0 0 0 3px rgba(217,119,87,.28),0 3px 0 rgba(20,20,19,.08)}
  .tile .num{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--clay-deep);line-height:1}
  .tile .pid{font-size:12px;color:var(--faint);font-family:var(--serif)} .tile .pname{font-size:18px;font-weight:600;margin-top:2px;line-height:1.2;font-family:var(--cjk)}
  .status{position:fixed;left:0;right:0;bottom:0;background:rgba(240,238,230,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;z-index:5;font-family:var(--serif)}
  .queue.on{color:var(--clay-deep);font-weight:600}
  .modal{position:fixed;inset:0;background:rgba(20,20,19,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px;z-index:8}
  .modal.show{display:flex}
  .box{background:#FAF9F5;border:1px solid var(--line);border-radius:18px;padding:20px;max-width:380px;width:100%;text-align:center;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(20,20,19,.25)}
  .box h2{margin:0 0 4px;font-size:22px;font-family:var(--cjk);font-weight:600} .box .sub2{color:var(--muted);font-size:13px;margin-bottom:12px;font-family:var(--serif)}
  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .btns button{flex:1;min-width:76px;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:18px;font-weight:600;cursor:pointer;background:var(--card);color:var(--ink);font-family:var(--serif);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 3px 0 rgba(20,20,19,.1);transition:transform .09s}
  .btns button:active{transform:translateY(3px);box-shadow:0 0 0 rgba(20,20,19,.1)}
  .btns button small{display:block;font-size:11px;font-weight:400;opacity:.8;margin-top:2px;font-family:var(--cjk)}
  .btns button.t1{background:#E9E5DC;color:var(--ink2)}
  .btns button.t3{background:linear-gradient(180deg,#E8C0A8,#D9A283);color:#4a2416;border-color:rgba(158,69,41,.35)}
  .btns button.t6{background:linear-gradient(180deg,#E8C36B,var(--gold));color:#3d2b00;border-color:rgba(138,95,20,.4)}
  button.ok{background:linear-gradient(180deg,#E08A67,var(--clay-deep))!important;color:#FFF9F5!important;border:none!important}
  button.no{background:#B4573A!important;color:#fff!important;border:none!important}
  button.warn{background:linear-gradient(180deg,#E8C36B,var(--gold))!important;color:#3d2b00!important;border:none!important}
  .ghost{background:transparent!important;color:var(--muted)!important;border:none!important;font-weight:400!important;box-shadow:none!important}
  .confirm-line{font-size:16.5px;line-height:1.8;background:rgba(240,238,230,.9);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font-family:var(--cjk)}
  .hostnote{background:rgba(217,119,87,.12);border:1px solid rgba(217,119,87,.45);color:var(--clay-deep);border-radius:10px;padding:9px 11px;font-size:14px;text-align:left;margin-bottom:8px;line-height:1.5;font-family:var(--cjk)}
  .hostnote.warn{background:rgba(190,90,76,.12);border-color:var(--red);color:#8a2f24}
  .hist{ text-align:left;font-size:14px;font-family:var(--cjk)}
  .hist .row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px dashed var(--line);padding:9px 2px}
  .hist .row.undone{opacity:.45;text-decoration:line-through}
  .hist .row button{padding:7px 10px;font-size:13px;flex:0 0 auto;border-radius:8px}
  .toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:var(--clay-deep);color:#FFF9F5;font-weight:600;padding:11px 18px;border-radius:999px;opacity:0;transition:.25s;font-size:14px;z-index:9;max-width:88vw;text-align:center;font-family:var(--cjk)}
  .toast.err{background:var(--red)}
  .toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.grid{padding-bottom:16px}.status{font-family:var(--ui)}
.delivery-panel{margin:0 14px 90px;padding:16px;background:#faf9f5;border:1px solid var(--line);border-radius:14px}
.delivery-heading{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.delivery-panel button{font:inherit;padding:10px 12px;border:1px solid #9e4529;border-radius:8px;background:white;color:#642b1a;margin:5px 4px 0 0;min-height:44px}
.delivery-panel p{line-height:1.6;font-size:14px}.delivery-item{border-top:1px solid #b9b5ab;padding:14px 0;overflow-wrap:anywhere}.delivery-item strong,.delivery-item small{display:block;margin-top:6px}.delivery-item.rejected strong,#storage-error{color:#922e24}.delivery-item small{font-size:12px}.delivery-item p{margin:8px 0}button:disabled{opacity:.55;cursor:wait}.searchbar input{min-width:0}
</style>

</head>
<body>
<header>
  <h1>站點 Check-in</h1>
  <div class="sub">玩家到站後，請選擇姓名，核對資料，再確認入分。</div>
</header>
<div class="cfg"><a href="start.html">返回營會入口</a><span id="connection" role="status">正在連接主持人…</span></div>
<div class="cfg">
  <select id="station" aria-label="站點"><option value="">請選擇站點</option>
    <option value="career">📈 事業站</option><option value="relation">💑 關係站</option>
    <option value="inner">🧘 內在站</option><option value="fun">🎉 享樂站</option><option value="faith">⛪ 信仰站</option>
  </select>
  <select id="round" aria-label="目前回合" disabled><option>R1</option><option>R2</option><option>R3</option><option>R4</option><option>R5</option><option>R6</option></select>
  <button onclick="loadRoster()">🔄 名單</button>
  <button onclick="openHist()">📝 本回合紀錄</button>
</div>
<div class="searchbar">
  <input id="q" type="search" inputmode="search" autocomplete="off"
    placeholder="🔍 打號碼或人名（例：7、P07、陳）" oninput="filterRoster()">
  <button class="clr" onclick="clearQ()">✕</button>
</div>
<div id="qhint" class="qhint"></div>
<div class="grid" id="grid">載入名單中…</div>

<!-- 入分 modal -->
<div class="modal" id="modal"><div class="box">
  <h2 id="m-name"></h2><div class="sub2" id="m-ctx"></div>
  <div id="m-hostnotes"></div>
  <div id="step-input">
    <div id="m-coins">
      <div style="color:var(--muted);font-size:13px;margin-bottom:8px" id="m-coins-label">請按任務表現選擇基本分數</div>
      <div class="btns" id="m-coins-btns"></div>
    </div>
    <div id="m-success" style="display:none">
      <div style="color:var(--muted);font-size:13px;margin:12px 0 8px">任務結果</div>
      <div class="btns"><button class="ok" onclick="succ(true)">成功</button><button class="no" onclick="succ(false)">失敗</button></div>
    </div>
  </div>
  <div id="step-confirm" style="display:none">
    <div class="confirm-line" id="c-line"></div>
    <div style="color:var(--gold);font-size:13.5px">入分前請核對玩家姓名、回合和分數。</div>
    <div class="btns" style="margin-top:12px">
      <button id="submit-score" class="warn" onclick="doSubmit()">✅ 確認入分</button>
      <button onclick="backToInput()">↩️ 返回改</button>
    </div>
  </div>
  <button class="ghost" style="margin-top:12px;width:100%" onclick="closeModal()">取消</button>
</div></div>

<!-- 紀錄/取消 modal -->
<div class="modal" id="hmodal"><div class="box">
  <h2>📝 本回合紀錄</h2><div class="sub2" id="h-ctx"></div>
  <div class="hist" id="h-list"></div>
  <button class="ghost" style="margin-top:12px;width:100%" onclick="$('hmodal').classList.remove('show')">關閉</button>
</div></div>

<section class="delivery-panel" aria-label="入分傳送狀態">
  <div class="delivery-heading"><strong id="queue-status" role="status" aria-live="polite">正在檢查紀錄…</strong>
  <button onclick="retryQueue()">立即重試未確認項目</button><button onclick="exportDiagnostics()">下載入分紀錄</button></div>
  <p>只有顯示「已確認入分」才代表伺服器已收到。未確認的項目會保留原編號重試；被拒絕的項目不會擋住其他人。</p>
  <div id="storage-error" role="alert"></div><div id="delivery-list"></div>
</section>
<div class="status"><span>站：<b id="s-st"></b>　回合：<b id="s-rd"></b></span><span>入分頁 R10</span></div>
<div class="toast" id="toast"></div>

<script src="station-sync.js?v=R10"></script>
<script>
// ── ✏️ 只此一行：你嘅 Lambda Function URL ────────────────
const BASE = 'https://pw3jpvywrpggt73vova47hq3la0depya.lambda-url.ap-northeast-1.on.aws';
// ──────────────────────────────────────────────────────
const $=id=>document.getElementById(id);
let stationReady=false;
const Sync=BethesdaStationSync;
const request=Sync.request;
async function staffState(){const r=await request(BASE+'/staff-state');const d=r.data;if(r.status!==200||!d.ok)throw new Error(d.msg||'未能取得目前回合，請重試。');if(d.access!=='open')throw new Error('站長免登入版本尚未就緒，請聯絡主持人。');return d;}
async function connectStation(){try{const d=await staffState();rdSel.value=d.round;stationReady=true;syncLabels();$('connection').textContent='已連線 · '+d.round+' · 毋須登入';await loadRoster();}catch(e){stationReady=false;$('connection').textContent=e.message;toast(e.message,true);}}
const esc=s=>String(s??'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
const stSel=$('station'),rdSel=$('round');
const stLabel=()=>stSel.options[stSel.selectedIndex].text;
function syncLabels(){$('s-st').textContent=stLabel();$('s-rd').textContent=rdSel.value;}
const requestedStation=new URLSearchParams(location.search).get('station');
if([...stSel.options].some(o=>o.value===requestedStation))stSel.value=requestedStation;
stSel.onchange=()=>{const u=new URL(location.href);u.searchParams.set('station',stSel.value);location.href=u.href;}; syncLabels();

// ── 名單（由 Notion 經 /roster 嚟：號碼排序 + 人名）──
let ROSTER=[];
async function loadRoster(){
  try{
    const r=await request(BASE+'/roster');
    const data=r.data;if(r.status!==200||!Array.isArray(data))throw new Error(data.msg||'名單讀取失敗');
    ROSTER=data.filter(x=>/^P[0-9]+$/i.test(x.id));
    renderRoster();
  }catch(e){$('grid').innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--muted)">未能載入名單；請確認網絡後按「名單」重試。</div>';}
}
const nameOf=id=>(ROSTER.find(p=>p.id===id)||{}).name||id;

// ── 搜尋：打號碼（7 / 07 / P07）或人名任何一部分即刻篩 ──
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,'');}
// 配對規則（為「打個號碼即刻鎖定一個人」而設）：
//   ① 純數字（可帶 p 前綴）→ 數值精確比對：打 7 只會出 P07，唔會撈埋 P17
//   ② 其他 → 人名／ID 模糊比對
function matches(p,q){
  if(!q) return true;
  const n=norm(q);
  const numQ=n.replace(/^p/,'');                       // 'p7'→'7'、'P07'→'07'
  if(/^\d+$/.test(numQ)){
    const pn=parseInt(norm(p.id).replace(/\D/g,''),10);
    return pn===parseInt(numQ,10);                     // 精確，唔做字串包含
  }
  return norm(p.name).includes(n)||norm(p.id).includes(n);
}
function renderRoster(list){
  const q=($('q')&&$('q').value)||'';
  const src=list||ROSTER;
  const shown=src.filter(p=>matches(p,q));
  const exact=q&&shown.length===1;
  $('grid').innerHTML = ROSTER.length
    ? (shown.length
        ? shown.map(p=>`<div class="tile ${exact?'hit':''}" onclick="openModal('${p.id}')">
             <div class="num">${p.id.replace(/^P/,'')}</div>
             <div class="pid">${p.id}</div><div class="pname">${esc(p.name)}</div></div>`).join('')
        : `<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:26px">找不到「${esc(q)}」。<br>請嘗試只輸入號碼，例如 7。</div>`)
    : '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:30px">尚未有已加入的玩家。玩家加入後，請按「名單」重新載入。</div>';
  $('qhint').textContent = q ? `${shown.length} / ${ROSTER.length} 位` : (ROSTER.length? `${ROSTER.length} 位玩家`:'');
}
function filterRoster(){ renderRoster(); }
function clearQ(){ if($('q')) $('q').value=''; renderRoster(); if($('q')) $('q').focus(); }

// ── 入分流程：揀分 →（事業站揀成敗）→ 確認畫面 → 送出 ──
let cur={id:null,coins:0,success:null};
function openModal(id){
  if(!stationReady){toast('尚未連上主持人，請稍候再試。',true);connectStation();return;}
  if(!stSel.value){toast('請先選擇你的站點。',true);stSel.focus();return;}
  cur={id,coins:0,success:null};
  $('m-name').textContent=`${id} ${nameOf(id)}`;
  $('m-ctx').textContent=`${rdSel.value} · ${stLabel()}`;
  const isAuction=stSel.value==='career'&&rdSel.value==='R4';
  const FIXED={inner:{R2:2,R3:2,R4:2,R5:2},faith:{R3:3,R4:3,R5:6}};
  const fixed=(FIXED[stSel.value]||{})[rdSel.value];
  const p=ROSTER.find(x=>x.id===id)||{};
  const hostNotes=((p.host||{})[stSel.value]||[]);
  const eligNote = (stSel.value==='career'&&rdSel.value==='R5'&&(p.purple||0)<2) ? '<div class="hostnote warn">⚠️ 此人 🧘 不足 2，本回合不能進 📈（請其改站）</div>' : '';
  $('m-success').style.display='none';
  const rules={career:{R1:'六十秒疊塔。',R4:'贏家取得全池原色代幣，另獲二十枚事業幣。站長不入分；由 Telegram 開標。',R5:'五秒分泥膠。相同差距同分：最小差距 6、下一個不同差距 3、其餘 1。'},relation:{R2:'五題全答：三題或以上相同得 6，兩題相同得 3，其餘得 1。',R5:'四人或以上三根手指；少於四人五根。依出局次序評分。'},fun:{R1:'必須播至 Level 6：完成 Level 6 得 6；完成 Level 5 得 3；其餘參與者得 1。'}};
  const stationRule=rules[stSel.value]?.[rdSel.value];
  $('m-hostnotes').innerHTML = (stationRule?'<div class="hostnote">'+esc(stationRule)+'</div>':'') + eligNote + hostNotes.map(t=>'<div class="hostnote">🃏 '+esc(t)+'</div>').join('');
  $('m-coins').style.display=(fixed!=null)?'none':'block';
  $('m-coins-btns').innerHTML = isAuction
    ? '<div style="color:var(--gold);font-size:14px;line-height:1.7">💰 R4 事業站＝暗標競投<br>玩家在手機出價；MC 在 Telegram 開標<br>全池原色代幣＋額外二十枚事業幣</div>'
    : '<button class="t1" onclick="pick(1)">1<small>嘗試</small></button><button class="t3" onclick="pick(3)">3<small>達標</small></button><button class="t6" onclick="pick(6)">6<small>出色</small></button>';
  showStep('input');
  if(fixed!=null){ cur.coins=fixed; toConfirm(); }   // 🧘 固定 2、⛪ R3/R4 固定 3、R5 固定 6
  $('modal').classList.add('show');
}
function showStep(which){
  $('step-input').style.display = which==='input'?'block':'none';
  $('step-confirm').style.display = which==='confirm'?'block':'none';
}
function pick(n){ cur.coins=n; toConfirm(); }   // 三級制：達標(≥3)=成功 由伺服器判斷，唔使再問成敗
function succ(b){cur.success=b; toConfirm();}
function toConfirm(){
  const FIXED={inner:{R2:2,R3:2,R4:2,R5:2},faith:{R3:3,R4:3,R5:6}};
  const fixed=(FIXED[stSel.value]||{})[rdSel.value];
  const scoreTxt=fixed!=null?`固定 ${fixed} 代幣`:`${cur.coins===6?'6 · 出色':cur.coins===3?'3 · 達標':'1 · 嘗試'}`;
  $('c-line').innerHTML=`<b>${cur.id} ${esc(nameOf(cur.id))}</b><br>${rdSel.value} · ${stLabel()}<br>${scoreTxt}`;
  showStep('confirm');
}
function backToInput(){showStep('input');}
function closeModal(){$('modal').classList.remove('show');}

let submitting=false,box=null,storageFailure='';
function storageProblem(e){storageFailure=e.message||String(e);$('storage-error').textContent=storageFailure;toast(storageFailure,true);}
function records(){return box?box.list():[];}
function legacyHistory(){let text;try{text=localStorage.getItem('bethesda_hist_A1');const h=JSON.parse(text||'[]');if(!Array.isArray(h))throw Error();return h;}catch{throw new Error('舊版入分紀錄未能讀取，請下載紀錄交由主持人核對，勿清除瀏覽資料。');}}
async function doSubmit(){
  if(submitting)return;
  submitting=true;$('submit-score').disabled=true;$('submit-score').textContent='正在核對回合…';
  try{
    if(!box||storageFailure)throw new Error(storageFailure||'此裝置尚未準備好保存操作。');
    const payload={operationId:Sync.uid(),type:'checkin',id:cur.id,round:rdSel.value,station:stSel.value,tier:cur.coins,coins:cur.coins};
    const pending=records().find(x=>x.payload.type==='checkin'&&x.payload.id===payload.id&&x.payload.round===payload.round&&['pending','sending','retry','review'].includes(x.status));
    if(pending)throw new Error('這位玩家已有未確認入分，請先查看下方原操作，避免重複提交。');
    const state=await staffState();
    if(state.round!==payload.round){rdSel.value=state.round;syncLabels();closeModal();throw new Error('回合已變更，請重新選擇玩家並核對分數。');}
    payload.context=state.context;
    box.add(payload);closeModal();clearQ();toast('已保存在此裝置，正在等待入分確認。');flush();
  }catch(e){storageProblemIfNeeded(e);toast(e.message,true);}
  finally{submitting=false;$('submit-score').disabled=false;$('submit-score').textContent='確認入分';}
}
function storageProblemIfNeeded(e){if(/保存|損壞|紀錄未能讀取/.test(e.message))storageProblem(e);}
function renderQ(){
  try{
    const list=records(),pending=list.filter(x=>['pending','sending','retry','review'].includes(x.status)),rejected=list.filter(x=>x.status==='rejected');
    $('queue-status').textContent='未確認 '+pending.length+' 筆 · 被拒絕 '+rejected.length+' 筆';
    const visible=list.filter(x=>!['succeeded','reviewed'].includes(x.status));
    $('delivery-list').innerHTML=visible.map(x=>`<article class="delivery-item ${x.status==='rejected'?'rejected':''}">
      <b>${esc(x.payload.id)} ${esc(nameOf(x.payload.id))} · ${esc(x.payload.round)} · ${x.payload.type==='undo'?'撤回':esc(x.payload.tier??x.payload.coins)+' 分'}</b>
      <strong>${x.status==='rejected'?'系統已拒絕，這筆未執行':x.status==='sending'?'正在傳送':'結果尚未確認'}</strong>
      <p>${esc(x.error||'等待傳送。')}</p><small>操作編號：${esc(x.key)}</small>
      ${x.status==='rejected'&&x.payload.type==='checkin'?`<button onclick="recheckRejected('${esc(x.key)}')">核對後重新選擇分數</button>`:''}
      <button onclick="reviewRecord('${esc(x.key)}')">主持人已核對此筆</button></article>`).join('')||'<p>目前沒有待處理項目。已成功入分的紀錄可在「本回合紀錄」查看。</p>';
  }catch(e){storageProblem(e);}
}
async function flush(force=false){if(!box||storageFailure)return;try{await box.flush(force);}catch(e){storageProblem(e);}}
async function retryQueue(){if(storageFailure){toast(storageFailure,true);return;}await flush(true);}
function reviewRecord(key){if(!confirm('主持人已在總機核對這一筆？標記後會停止重試，原紀錄仍會保留。'))return;try{box.update(key,{status:'reviewed',reviewedAt:Date.now()});}catch(e){storageProblem(e);}}
async function recheckRejected(key){
  try{const x=records().find(x=>x.key===key);if(!x||x.status!=='rejected')return;
    const state=await staffState();rdSel.value=state.round;syncLabels();
    if(state.round!==x.payload.round){toast('原操作屬於 '+x.payload.round+'，目前是 '+state.round+'。請主持人核對舊回合分數。',true);return;}
    await loadRoster();openModal(x.payload.id);
  }catch(e){toast(e.message,true);}
}
function historyEntries(){
  const newer=records().filter(x=>x.payload.type==='checkin'&&x.status==='succeeded').map(x=>({key:x.key,payload:x.payload,...x.response}));
  const ids=new Set(newer.map(x=>x.payload.operationId));
  return [...legacyHistory().filter(x=>x.solid&&!ids.has(x.payload?.operationId)).map((x,i)=>({...x,key:'old-'+i})),...newer];
}
function openHist(){
  try{
    $('h-ctx').textContent=rdSel.value+' · '+stLabel()+'（這部裝置的紀錄）';
    const all=records(),h=historyEntries().filter(x=>x.payload.round===rdSel.value&&x.payload.station===stSel.value);
    $('h-list').innerHTML=h.map(x=>{
      const undo=all.find(y=>y.payload.type==='undo'&&y.payload.receipt===x.receipt);
      const undone=x.undone||undo?.status==='succeeded';
      return `<div class="row ${undone?'undone':''}"><span>${esc(x.payload.id)} ${esc(nameOf(x.payload.id))} · ${esc(x.dispense||x.payload.coins)}</span>${undone?'<span>已撤回</span>':undo&&undo.status!=='rejected'?'<span>撤回待核對</span>':`<button onclick="doUndo('${esc(x.key)}')">撤回</button>`}</div>`;
    }).join('')||'<p>此站本回合尚未有已確認紀錄。</p>';
    $('hmodal').classList.add('show');
  }catch(e){storageProblem(e);}
}
const undoBusy=new Set();
async function doUndo(key){
  if(undoBusy.has(key))return;undoBusy.add(key);
  try{
    const x=historyEntries().find(x=>x.key===key);if(!x||x.undone)return;
    const old=records().find(y=>y.payload.type==='undo'&&y.payload.receipt===x.receipt&&y.status!=='rejected');
    if(old){await flush(true);openHist();return;}
    const state=await staffState();
    if(state.round!==x.payload.round)throw new Error('回合已變更，請主持人核對原入分。');
    box.add({type:'undo',operationId:Sync.uid(),id:x.payload.id,round:x.payload.round,station:x.payload.station,receipt:x.receipt,context:state.context});
    await flush();openHist();
  }catch(e){storageProblemIfNeeded(e);toast(e.message,true);}finally{undoBusy.delete(key);}
}
function exportDiagnostics(){
  const saved={};let failure='';
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^bethesda_(station_R10|queue_|hist_)/.test(k))saved[k]=localStorage.getItem(k);}}catch(e){failure=e.message;}
  const data={version:'R10',at:new Date().toISOString(),browser:navigator.userAgent,online:navigator.onLine,station:stSel.value,round:rdSel.value,storageError:storageFailure||failure,records:saved};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='bethesda-station-records-'+Date.now()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function startOutbox(){
  if(!stSel.value)return;
  try{
    box=new Sync.Outbox({storage:localStorage,station:stSel.value,send:p=>request(BASE+(p.type==='undo'?'/undo':'/checkin'),p),changed:renderQ,notify:toast});
    box.migrate();
    legacyHistory().filter(x=>x.undoPending&&!x.undone&&x.undoRequest&&x.payload.station===stSel.value).forEach(x=>box.add(x.undoRequest));
    renderQ();flush();
  }catch(e){storageProblem(e);}
}
window.addEventListener('online',()=>{connectStation();flush(true);});
window.addEventListener('storage',()=>renderQ());
setInterval(()=>{if(!document.hidden&&navigator.onLine!==false)flush();},3000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)flush();});
let tH;function toast(m,err){const t=$('toast');t.textContent=m;t.className='toast show'+(err?' err':'');clearTimeout(tH);tH=setTimeout(()=>t.className='toast'+(err?' err':''),2600);}
startOutbox(); connectStation();
</script>
<script>// Keep the displayed round aligned with MC; never change an open scoring form.
let staffPolling=false;
async function followMC(){if(staffPolling||document.hidden||$('modal').classList.contains('show'))return;staffPolling=true;try{const st=await staffState();stationReady=true;$('connection').textContent='已連線 · '+st.round+' · 毋須登入';if(rdSel.value!==st.round){rdSel.value=st.round;syncLabels();await loadRoster();toast('已跟隨主持人切換至 '+st.round);}}catch(e){toast('連線未更新；入分前會再次核對回合。',true);}finally{staffPolling=false;}}
setInterval(followMC,4000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)followMC();});
</script>
<script src="quality.js"></script>
