<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F0EEE6">
<title>人生手冊 · 我的錢包</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F0EEE6;--paper2:#FAF9F5;
  --clay:#D97757;--clay-deep:#9E4529;--clay-soft:#E8C0A8;
  --ink:#141413;--ink2:#3D3D3A;--muted:#6B6963;--faint:#A8A59D;
  --line:rgba(20,20,19,.11);--line2:rgba(20,20,19,.06);
  --g:#4C7A52;--r:#BE5A4C;--p:#7A6099;--y:#9E7016;--b:#43698F;
  --serif:"Cormorant Garamond","Songti TC","Noto Serif CJK TC","Noto Serif TC",serif;
  --cjk:"Songti TC","Noto Serif CJK TC","Noto Serif TC","Source Han Serif TC",
        "PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",serif;
  --ui:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans CJK TC",
       "Microsoft JhengHei",Roboto,system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--ui);color:var(--ink);padding-bottom:36px;background-color:var(--paper);
  background-image:
    radial-gradient(1200px 700px at 82% -14%, rgba(217,119,87,.10), transparent 60%),
    radial-gradient(820px 560px at 4% 16%, rgba(158,69,41,.055), transparent 64%),
    radial-gradient(640px 640px at 46% 108%, rgba(217,119,87,.06), transparent 62%),
    repeating-linear-gradient(72deg,transparent 0 26px, rgba(158,69,41,.055) 26px 27px,
      transparent 27px 54px, rgba(20,20,19,.030) 54px 55px, transparent 55px 112px),
    repeating-linear-gradient(-54deg,transparent 0 44px, rgba(20,20,19,.026) 44px 45px,
      transparent 45px 96px, rgba(217,119,87,.055) 96px 97px, transparent 97px 168px),
    repeating-linear-gradient(18deg,transparent 0 150px, rgba(158,69,41,.035) 150px 152px, transparent 152px 300px),
    repeating-linear-gradient(-83deg,transparent 0 200px, rgba(20,20,19,.018) 200px 201px, transparent 201px 420px),
    linear-gradient(166deg,#FAF9F5 0%,#F2F0E8 40%,#EDEAE0 72%,#F5F2EA 100%);
  background-attachment:fixed;background-size:cover;
}
.wrap{max-width:540px;margin:0 auto;padding:12px 14px 0}
header{text-align:center;padding:8px 0 2px}
.greek{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--clay-deep);opacity:.85}
h1{font-family:var(--cjk);font-size:21px;font-weight:600;letter-spacing:.2em;margin:3px 0 0;text-indent:.2em}

/* ═══ 人生階段橫額 ═══ */
.stage{margin:12px 0 12px;text-align:center;position:relative;
  animation:stageIn .55s var(--spring) both}
@keyframes stageIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
.stage .rail{height:1px;background:linear-gradient(90deg,transparent,rgba(158,69,41,.42),transparent);margin-bottom:9px}
.stage .row{display:inline-flex;align-items:baseline;gap:9px;flex-wrap:wrap;justify-content:center}
.stage .rd{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--clay-deep);
  border:1px solid rgba(158,69,41,.34);border-radius:20px;padding:1px 10px;letter-spacing:.06em}
.stage .ic{font-size:16px}
.stage .nm{font-family:var(--cjk);font-size:16.5px;font-weight:600;color:var(--ink);letter-spacing:.07em}
.stage .ag{font-family:var(--serif);font-size:15px;color:var(--ink2)}
.stage .tg{font-family:var(--cjk);font-size:12.5px;color:var(--muted)}
.stage .nt{font-family:var(--cjk);font-size:12px;color:var(--faint);margin-top:5px;line-height:1.6}
.stage .rail2{height:1px;background:linear-gradient(90deg,transparent,rgba(158,69,41,.22),transparent);margin-top:9px}

/* ═══ 號碼牌（3D 浮起）═══ */
.badge{display:flex;align-items:center;justify-content:center;gap:13px;
  background:linear-gradient(140deg,rgba(217,119,87,.15),rgba(232,192,168,.08));
  border:1px solid rgba(217,119,87,.36);border-radius:16px;padding:12px 15px;margin-bottom:12px;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 4px 0 rgba(158,69,41,.13),0 8px 20px rgba(158,69,41,.13);
  animation:cardIn .5s var(--spring) both}
.badge .no{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;color:var(--clay-deep)}
.badge .who{text-align:left;line-height:1.35}
.badge .who .n{font-family:var(--cjk);font-size:19px;font-weight:600}
.badge .who .t{font-size:11px;color:var(--muted)}

/* ═══ 卡（分層立體）═══ */
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:rgba(255,254,250,.74);border:1px solid var(--line);border-radius:16px;
  padding:15px;margin-bottom:12px;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 2px 0 rgba(20,20,19,.045),
             0 10px 26px rgba(20,20,19,.07);
  animation:cardIn .45s var(--spring) both}
.card h2{font-family:var(--cjk);font-size:15px;font-weight:600;margin:0 0 11px;letter-spacing:.05em}
.card h2 .hint{float:right;font-size:11px;color:var(--faint);font-weight:400;letter-spacing:0}
.wrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.rk{font-family:var(--serif);font-size:18px;color:var(--clay-deep);font-weight:600}
.rk small{font-size:11px;color:var(--faint);font-family:var(--ui);font-weight:400}
.toks{display:flex;gap:6px}
.tok{flex:1;text-align:center;background:rgba(240,238,230,.8);border:1px solid var(--line2);
  border-radius:12px;padding:9px 2px;position:relative;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 2px 0 rgba(20,20,19,.05)}
.tok::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;opacity:.9}
.tok.k-green::after{background:var(--g)}.tok.k-red::after{background:var(--r)}
.tok.k-purple::after{background:var(--p)}.tok.k-yellow::after{background:var(--y)}
.tok.k-blue::after{background:var(--b)}
.tok .e{font-size:15px;line-height:1.1}
.tok .n{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1;margin-top:1px;
  transition:transform .4s var(--spring)}
.tok.bump .n{transform:scale(1.35)}
.tok .l{font-size:10px;color:var(--muted);font-family:var(--cjk)}
.tok.mask .n{font-size:15px;color:var(--faint);letter-spacing:.06em}
.meta{display:flex;gap:15px;justify-content:center;margin-top:11px;font-size:13px;
  color:var(--ink2);flex-wrap:wrap;font-family:var(--serif)}
.cardsline{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
  font-size:12.5px;color:var(--muted);line-height:1.85;font-family:var(--cjk)}
.cardsline b{color:var(--ink2);font-weight:600}
.mycards{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.mycards summary{font-family:var(--cjk);font-size:13px;color:var(--ink2);cursor:pointer;list-style:none;padding:4px 0}
.mycards summary::-webkit-details-marker{display:none}
.mycards summary::before{content:"▸ ";color:var(--clay)}
.mycards[open] summary::before{content:"▾ "}
.mc{display:grid;grid-template-columns:3.2em 1fr;gap:2px 10px;padding:8px 0;border-bottom:1px dashed var(--line2);font-family:var(--cjk)}
.mc .mk{font-size:11px;color:var(--muted);letter-spacing:.1em;grid-row:span 2;align-self:start;padding-top:3px}
.mc b{font-size:14.5px;color:var(--ink)}.mc .me{font-size:13px;color:var(--ink2);line-height:1.6}
.mnote{font-size:11.5px;color:var(--faint);margin-top:8px;font-family:var(--cjk)}

/* ═══ prompt ═══ */
.prompt{background:linear-gradient(150deg,rgba(217,119,87,.11),rgba(255,254,250,.88));
  border:1px solid rgba(217,119,87,.34);border-radius:16px;padding:17px;margin-bottom:12px;
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 3px 0 rgba(158,69,41,.10),
             0 12px 30px rgba(158,69,41,.11);
  animation:cardIn .5s var(--spring) both}
.prompt h2{font-family:var(--cjk);font-size:16.5px;margin:0 0 10px}
.prompt .body{white-space:pre-wrap;line-height:1.95;font-size:15px;font-family:var(--cjk);
  margin-bottom:16px;color:var(--ink2)}
.opts{display:flex;flex-direction:column;gap:10px}

/* ═══ 有份量嘅掣：實體按鍵感 ═══ */
button.opt{width:100%;text-align:left;background:linear-gradient(180deg,#FFFDF9,#F6F3EC);
  color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:14px 16px;
  font-size:15.5px;font-family:var(--cjk);cursor:pointer;line-height:1.45;position:relative;
  box-shadow:0 1px 0 rgba(255,255,255,.95) inset,0 3px 0 rgba(20,20,19,.13),0 6px 14px rgba(20,20,19,.09);
  transform:translateY(0);transition:transform .09s ease,box-shadow .09s ease,background .12s}
button.opt:active{transform:translateY(3px);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 0 0 rgba(20,20,19,.13),0 2px 6px rgba(20,20,19,.10);
  background:linear-gradient(180deg,#F7EFE7,#EFE6DC)}
button.opt.pressing{transform:translateY(3px) scale(.995)}
button.opt .s{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--ui)}
button.opt[disabled]{opacity:.42;transform:none!important;box-shadow:0 2px 0 rgba(20,20,19,.08)}
.row2{display:flex;gap:10px}.row2 button.opt{flex:1;text-align:center}
button.seal{background:linear-gradient(180deg,#E08A67,var(--clay-deep));color:#FFF9F5;
  border:1px solid rgba(158,69,41,.6);font-weight:700;
  box-shadow:0 1px 0 rgba(255,255,255,.28) inset,0 3px 0 #7C3520,0 8px 18px rgba(158,69,41,.32)}
button.seal:active{box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 0 0 #7C3520,0 3px 8px rgba(158,69,41,.28)}
button.ghost{background:linear-gradient(180deg,#F4F1EA,#EAE6DD);color:var(--muted);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 2px 0 rgba(20,20,19,.1),0 4px 10px rgba(20,20,19,.06)}
button.mini{font-size:13px;padding:9px 14px;border-radius:11px;width:auto}
/* ═══ v7：誘因／隱藏任務／星號站 ═══ */
.inc{font-family:var(--cjk);font-size:12.5px;color:var(--clay-deep);line-height:1.8;margin:-6px 0 12px;padding:8px 12px;border-left:2px solid rgba(217,119,87,.5);background:rgba(217,119,87,.06);border-radius:0 8px 8px 0}
.mission{margin-top:12px;font-family:var(--cjk);font-size:13px;color:#2c4f75;background:rgba(67,105,143,.10);border:1px dashed rgba(67,105,143,.45);border-radius:10px;padding:9px 12px;line-height:1.7}
button.opt.star{border-color:rgba(201,150,43,.7);box-shadow:0 1px 0 rgba(255,255,255,.95) inset,0 3px 0 rgba(138,95,20,.35),0 6px 14px rgba(201,150,43,.18)}
button.opt.star .s{color:#8a5f14}
/* ═══ 池邊衝刺（Kahoot）═══ */
.prompt.rush{border-color:rgba(67,105,143,.45);background:linear-gradient(150deg,rgba(67,105,143,.12),rgba(255,254,250,.9))}
.rushpin{text-align:center;font-family:var(--serif);font-size:18px;color:var(--ink2);margin:4px 0 12px;letter-spacing:.06em}
.rushpin b{font-size:30px;color:#2c4f75;letter-spacing:.14em}
a.opt{display:block;text-decoration:none;box-sizing:border-box}
a.opt.rushbtn{text-align:center;font-size:19px;font-weight:700}
.bidnow{background:rgba(240,238,230,.85);border:1px solid var(--line);border-radius:12px;
  padding:12px;text-align:center;font-size:16.5px;margin-bottom:12px;font-family:var(--serif);
  box-shadow:0 2px 0 rgba(20,20,19,.05) inset}

/* ═══ 結果 ═══ */
.result{background:rgba(255,254,250,.93);border:1px solid var(--line);
  border-left:3px solid var(--clay);border-radius:12px;padding:16px;margin-bottom:12px;
  white-space:pre-wrap;line-height:2.0;font-size:15px;font-family:var(--cjk);color:var(--ink2);
  box-shadow:0 2px 0 rgba(20,20,19,.04),0 10px 24px rgba(20,20,19,.07);
  animation:resultIn .6s var(--spring) both}
@keyframes resultIn{from{opacity:0;transform:translateY(14px) rotateX(6deg)}to{opacity:1;transform:none}}
.result .tag{display:block;font-size:11px;color:var(--clay-deep);margin-bottom:8px;
  letter-spacing:.12em;font-family:var(--ui)}
.waiting{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 12px;
  font-family:var(--cjk);line-height:2}
.waiting .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--clay);
  margin-right:7px;animation:blink 1.7s ease-in-out infinite}
@keyframes blink{50%{opacity:.22}}
.chosenbox{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chosenbox .cv{font-family:var(--cjk);font-size:16px;font-weight:600}

/* ═══ 人物養成 ═══ */
.avatarwrap{display:flex;justify-content:center;padding:2px 0 6px}
svg.avatar{width:172px;height:auto;overflow:visible}
.avcap{text-align:center;font-family:var(--cjk);font-size:12.5px;color:var(--muted);
  line-height:1.7;margin-top:2px}
.avcap b{color:var(--clay-deep);font-weight:600}
.growth{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:12px 2px 4px;margin-top:10px;border-top:1px dashed var(--line)}
.gstep{flex:0 0 auto;text-align:center;width:62px;opacity:.9}
.gstep svg{width:52px;height:auto}
.gstep .gl{font-family:var(--serif);font-size:11px;color:var(--muted);margin-top:1px}
.gstep.now .gl{color:var(--clay-deep);font-weight:600}
.gstep.now{opacity:1}
.tl{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.tlrow{display:flex;gap:9px;padding:6px 0;font-size:12.5px;align-items:baseline}
.tlrow .rd{font-family:var(--serif);font-size:14px;color:var(--clay-deep);min-width:32px;
  flex:0 0 auto;font-weight:600}
.tlrow .tx{color:var(--ink2);font-family:var(--cjk);line-height:1.55}
.tlrow .tx em{font-style:normal;color:var(--muted)}

details summary{color:var(--muted);font-size:12.5px;cursor:pointer;padding:5px 0;
  list-style:none;font-family:var(--cjk)}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";color:var(--clay)}
details[open] summary::before{content:"▾ "}
.logrow{font-size:12.5px;color:var(--muted);padding:6px 2px;border-bottom:1px dashed var(--line2);
  display:flex;justify-content:space-between;gap:10px;font-family:var(--cjk)}
.err{background:rgba(190,90,76,.10);border:1px solid rgba(190,90,76,.38);color:var(--clay-deep);
  border-radius:12px;padding:14px;text-align:center;font-size:14.5px;margin-bottom:12px;
  line-height:1.75;font-family:var(--cjk)}
.status{text-align:center;font-size:11px;color:var(--faint);margin:14px 0 6px;font-family:var(--serif)}
.locked{text-align:center;font-size:12.5px;color:var(--clay-deep);margin:-4px 0 12px;font-family:var(--cjk)}
.offline{background:rgba(217,119,87,.11);border:1px solid rgba(217,119,87,.36);color:var(--clay-deep);
  border-radius:11px;padding:10px;text-align:center;font-size:12.5px;margin-bottom:12px;font-family:var(--cjk)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* R3: rendered portrait and the player's actual decision traces. */
.portrait-card{background:#e9dfcc;border:1px solid #c8b592;overflow:hidden}
.avatarwrap{position:relative;display:block!important;min-height:340px;margin:12px -16px 0;isolation:isolate;background:#cfc0a4}
.life-portrait{width:100%;aspect-ratio:1;background-image:url('art/character-rear.png');background-size:300% 200%;background-position:var(--portrait-x) var(--portrait-y);box-shadow:inset 0 -28px 40px #35271822;transition:opacity .6s ease}
.life-portrait.mini{width:86px;height:86px;aspect-ratio:1;border:1px solid #c2ac88;box-shadow:0 4px 10px #49311e22}
.life-traces{position:relative;margin-top:-50px;padding:0 18px 18px;display:grid;gap:8px}
.life-trace{position:relative;background:#eee5d5f5;border-left:2px solid #997a4f;padding:12px 15px;box-shadow:0 8px 22px #251b1a25;animation:trace-arrive .7s ease both;text-align:left}
.life-trace small{font-size:11px;letter-spacing:.15em;color:#785f40}.life-trace p{font-family:var(--cjk,serif);font-size:14px;line-height:1.8;margin:6px 0 0}
.trace-1{margin-left:12px}.trace-2{margin-left:24px}.avcap{line-height:1.8;padding:14px;font-family:serif}.avcap small{font-size:12px;color:#6e604f}
@keyframes trace-arrive{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.life-trace,.life-portrait{animation:none;transition:none}}

.avatarwrap>.life-portrait{transform:rotate(var(--life-turn,0deg)) scale(1.05);transform-origin:50% 80%;transition:transform 700ms cubic-bezier(.2,.8,.2,1)}
.avatarwrap>.life-portrait:after{content:"";position:absolute;inset:50% 14% 0;background:linear-gradient(0deg,var(--fabric-tint),transparent);mix-blend-mode:multiply;pointer-events:none}
.fabric-linen{--fabric-tint:#a9916d25}.fabric-slate{--fabric-tint:#35445142}.fabric-umber{--fabric-tint:#68432e42}
.carried-memories{position:absolute;left:12px;right:12px;top:45%;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.carried-memory{margin:0;width:27%;max-width:110px;background:#241c16;border:1px solid #b4976f;box-shadow:0 8px 25px #17120dcc;transform:rotate(-4deg) translateY(14px);animation:trace-arrive .7s ease both}
.carried-memory.memory-1{transform:rotate(2deg) translateY(30px)}.carried-memory.memory-2{transform:rotate(5deg)}
.memory-image{aspect-ratio:1;background-image:url('art/memory-objects.png');background-size:300% 200%}
.carried-memory figcaption{color:#f4eadb;background:#241c16;font-size:11px;line-height:1.5;padding:7px;text-align:left}
.life-traces{margin-top:0}.life-portrait.mini{position:relative;flex-shrink:0}
/* R4: compact montage; all copy stays in normal document flow. */
.portrait-card{background:#ede5d6;overflow:visible}.avatarwrap{min-height:0;margin:0;display:grid!important;grid-template-columns:112px minmax(0,1fr);gap:8px;background:transparent;align-items:center}
.avatarwrap>.life-portrait{position:relative;width:112px;height:146px;aspect-ratio:auto;background-size:390% 260%;mask-image:radial-gradient(ellipse 57% 65% at 50% 45%,#000 42%,transparent 88%);-webkit-mask-image:radial-gradient(ellipse 57% 65% at 50% 45%,#000 42%,transparent 88%);transform:rotate(var(--life-turn,0deg));box-shadow:none}
.carried-memories{position:relative;inset:auto;display:flex;gap:6px;align-items:center;justify-content:flex-start;min-width:0;flex-wrap:wrap;padding:8px 0}
.carried-memory,.carried-memory.memory-1,.carried-memory.memory-2{transform:none;width:calc(33.333% - 4px);max-width:76px;box-shadow:none;border:0;background:transparent;animation:none}.memory-image{mask-image:radial-gradient(ellipse,#000 45%,transparent 73%);-webkit-mask-image:radial-gradient(ellipse,#000 45%,transparent 73%)}
.carried-memory figcaption{color:#403729;background:transparent;font-size:11px;line-height:1.5;padding:3px 0;overflow-wrap:anywhere;text-align:center}.memory-details{grid-column:1/-1}.life-traces{padding:8px 0 0;gap:8px}.trace-1,.trace-2{margin:0}.life-trace{box-shadow:none;background:#f8f3e8}.avcap{font-size:12px;padding:6px 0;color:#554735}.avcap small{display:none}.history-details{margin-top:10px}.portrait-card summary{font-size:13px;color:#5c4833;padding:8px 0;cursor:pointer}
.stage .row{flex-wrap:wrap;gap:6px}.stage .tg{display:none}.stage .nt{display:none}.card,.result,.opt,.btn{overflow-wrap:anywhere;min-width:0}.wrap{width:100%;max-width:540px}.growth{overflow-x:auto;max-width:100%}
@media(max-width:350px){.avatarwrap{grid-template-columns:90px minmax(0,1fr)}.avatarwrap>.life-portrait{width:90px;height:130px}.carried-memory figcaption{font-size:10px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="greek">你正在用甚麼，衡量自己的一生？</div>
    <h1>人生手冊</h1>
  </header>
  <div id="app"></div>

</div>

<script>
// ── ✏️ 只此一行：你嘅 Lambda Function URL ────────────────
const BASE = 'https://pw3jpvywrpggt73vova47hq3la0depya.lambda-url.ap-northeast-1.on.aws';
// ──────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const qp = new URLSearchParams(location.search);
const ID = qp.get('id') || '', TOKEN = qp.get('t') || '';
const SKEY = 'bethesda_player_B1_' + ID;

let VIEW = null, LOCALPROMPT = null, LASTRESULT = null, RESULTROUND = null, ACTIONS = [], busy = false;
let everOK = false, PREVTOK = null, renderedKey = null, pollGeneration = 0, polling = false;

const esc = s => String(s == null ? '' : s).replace(/[<>&"']/g,
  c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;' }[c]));
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

// ═══ 救生艇 ═══
function save() {
  try { localStorage.setItem(SKEY, JSON.stringify({
    view: VIEW, localPrompt: LOCALPROMPT, lastResult: LASTRESULT, resultRound: RESULTROUND, ts: Date.now() })); } catch {}
}
function restore() {
  try {
    const d = JSON.parse(localStorage.getItem(SKEY) || 'null');
    if (!d || Date.now() - d.ts > 86400000) return false;
    VIEW = d.view; LOCALPROMPT = d.localPrompt; LASTRESULT = d.lastResult; RESULTROUND = d.resultRound || null;
    return !!VIEW;
  } catch { return false; }
}

function btn(cls, action, inner, disabled) {
  const i = ACTIONS.push(action) - 1;
  return '<button class="' + cls + '" data-act="' + i + '"' + (disabled ? ' disabled' : '') + '>' + inner + '</button>';
}
const encB = b => ['green','red','purple','yellow','blue'].map(k => b[k] || 0).join('.');
function actOf(p, o) {
  if (p.kind === 'station') return { type: 'station', station: o.value };
  if (p.kind === 'interactive') return { type: 'interactive', ref: p.ref, choice: o.value, top3: !!p.top3 };
  if (p.kind === 'lookback') return { type: 'lookback', choice: o.value };
  return {};
}

// ═══════════════════════════════════════════════════════════
//  人物養成：sketchy 手繪風，隨人生階段 + 代幣結構變化
// ═══════════════════════════════════════════════════════════
const STAGE_ORDER = ['R1','R2','R3','R4','R5','R6'];
const stageOf = r => { const n = parseInt(String(r).replace(/\D/g, ''), 10) || 1; return Math.min(6, Math.max(1, n)); };
const TOKCOL = { green:'#4C7A52', red:'#BE5A4C', purple:'#7A6099', yellow:'#9E7016', blue:'#43698F' };

// 主導代幣（R3 前唔計 🔵，保密）
function dominant(t, roundNum) {
  const keys = ['green','red','purple','yellow'].concat(roundNum >= 3 ? ['blue'] : []);
  let best = null, bv = 0, ties = 0;
  for (const k of keys) {
    const v = t[k] || 0;
    if (v > bv) { bv = v; best = k; ties = 1; }
    else if (v === bv && v > 0) ties++;
  }
  if (bv <= 0) return null;          // 未有任何代幣
  return ties > 1 ? '__tie__' : best; // 兩色打和 = 仲喺度拉扯
}

// 生成一個人物 SVG。size: 'big' | 'mini'
function avatarSVG(tokens, roundNum, opts={}) {
  const age=Math.max(0,Math.min(5,(roundNum||1)-1));
  return `<div class="life-portrait ${opts.mini?'mini':''}" role="img" aria-label="人生第 ${age+1} 階段的油畫人物" style="--portrait-x:${age%3*50}%;--portrait-y:${age<3?0:100}%"></div>`;
}

const DOMLABEL = { green:'事業行頭', red:'關係行頭', purple:'內在行頭', yellow:'享樂行頭', blue:'信仰行頭',
  __tie__:'兩邊拉扯，未分高下' };
const WEARLABEL = {1:'少年：未寫完的一頁',2:'大學：向外走的時候',3:'初職：責任開始有了重量',4:'建立：手中多了一把鑰匙',5:'風暴：留下來的，仍要承擔',6:'回望：歲月留在手上'};

function growthHTML(v) {
  const rn = stageOf(v.round);
  const h = (v.history || []).filter(x => x && x.round);
  const dom = dominant(v.wallet ? Object.fromEntries(v.wallet.tokens.map(t => [t.key, t.count])) : {}, rn);
  const curTok = Object.fromEntries((v.wallet?.tokens || []).map(t => [t.key, t.count]));
  const steps = h.map(p => {
    const n = stageOf(p.round);
    const now = String(p.round).includes('而家');
    return '<div class="gstep' + (now ? ' now' : '') + '">' +
      avatarSVG(p, n, { mini: true }) +
      '<div class="gl">' + esc(String(p.round).replace('（而家）', '')) + '</div></div>';
  }).join('');
  const tl = (v.choices || []).slice(-10).map(c => {
    const label = c.act === '🧭選站' ? '去了 <em>' + esc(c.note) + '</em>'
      : c.act === '🧭改揀' ? '<em>改了主意</em>'
      : c.act === '💰暗標' ? '暗標出價 <em>' + esc(c.note) + '</em>'
      : c.act === '💰開標' ? '<em>' + esc(c.note) + '</em>'
      : esc(c.act.replace('🎭', '')) + ' — <em>' + esc(c.note) + '</em>';
    return '<div class="tlrow"><span class="rd">' + esc(c.round) + '</span><span class="tx">' + label + '</span></div>';
  }).join('');
  return '<div class="card portrait-card"><h2>我走到了這裏 <span class="hint">' + esc(v.round) + '</span></h2>' +
    '<div class="avatarwrap fabric-'+esc(v.appearance?.fabric||'linen')+'" style="--life-turn:'+Number(v.appearance?.turn||0)+'deg">' + avatarSVG(curTok, rn, {}) +
    '<div class="carried-memories">'+(v.appearance?.memories||[]).slice(-3).map((m,i)=>'<figure class="carried-memory memory-'+i+'"><div class="memory-image" style="background-position:'+(m.object%3*50)+'% '+(m.object<3?0:100)+'%"></div><figcaption>'+esc(m.label)+'</figcaption></figure>').join('')+'</div>'+
    '<details class="memory-details"><summary>展開我的足跡</summary><div class="life-traces">'+(v.choices||[]).filter(c=>c.act.startsWith('🎭')||c.act==='💰開標').slice(-3).map((c,i)=>'<div class="life-trace trace-'+i+'"><small>'+esc(c.round)+' · 已走過</small><p>'+esc(c.choiceText||c.note)+'</p></div>').join('')+'</div></details></div>' +
    '<div class="avcap">' + esc(WEARLABEL[rn] || '') +
      '<br><small>你的選擇留在下方；這幅人生肖像不替你判定好壞。</small>' + '</div>' +
    (steps ? '<details class="history-details"><summary>人生剪影</summary><div class="growth">' + steps + '</div></details>' : '') +
    (tl ? '<details class="history-details"><summary>完整選擇紀錄</summary><div class="tl">' + tl + '</div></details>' : '') + '</div>';
}

// ═══ 各區塊 ═══
function stageHTML(v) {
  const s = v.stage;
  if (!s) return '';
  return '<div class="stage"><div class="rail"></div><div class="row">' +
    '<span class="rd">' + esc(v.round) + '</span>' +
    '<span class="ic">' + esc(s.icon) + '</span>' +
    '<span class="nm">' + esc(s.stage) + '</span>' +
    '<span class="ag">' + esc(s.age) + '</span>' +
    '<span class="tg">· ' + esc(s.tag) + '</span></div>' +
    '' +
    '<div class="rail2"></div></div>';
}

function badgeHTML(v) {
  return '<div class="badge"><span class="no">' + esc(v.id) + '</span>' +
    '<span class="who"><span class="n">' + esc(v.name) + '</span><br>' +
    '<span class="t">入分時，向站長報這個號碼</span></span></div>';
}

function walletHTML(v) {
  const toks = v.wallet.tokens.filter(t => !t.hidden).map(t => {
    const bump = PREVTOK && PREVTOK[t.key] !== undefined && PREVTOK[t.key] !== t.count;
    return '<div class="tok k-' + t.key + (t.masked ? ' mask' : '') + (bump ? ' bump' : '') + '">' +
      '<div class="e">' + t.emoji + '</div>' +
      '<div class="n">' + (t.masked ? '？？' : t.count) + '</div>' +
      '<div class="l">' + (t.masked ? '' : esc(t.name)) + '</div></div>';
  }).join('');
  const meta = [];
  if (v.wallet.gold !== null) meta.push('🥇 ' + v.wallet.gold);
  if (v.wallet.markers) meta.push('🤝 ' + v.wallet.markers);
  if (v.wallet.marks && v.wallet.marks.scale) meta.push('⚖ ' + v.wallet.marks.scale);
  if (v.wallet.marks && v.wallet.marks.candle) meta.push('🕯 ' + v.wallet.marks.candle);
  meta.push('合共 ' + v.wallet.total + ' 枚');
  const c = v.cards;
  return '<div class="card"><div class="wrow">' +
    '<h2 style="margin:0">👛 我的錢包</h2>' +
    '<span class="rk">' + (v.rank ? '#' + v.rank : '') +
      '<small>' + (v.rank ? ' / ' + v.fieldSize : '') + '</small></span></div>' +
    '<div class="toks">' + toks + '</div>' +
    '<div class="meta">' + meta.map(m => '<span>' + m + '</span>').join('') + '</div>' +
    '<details class="mycards"><summary>🃏 我的牌 · ' + (esc((c.personality || []).join('、')) || '—') + ' · ' + (esc(c.environment) || '—') + ' · ' + (esc(c.desire) || '—') + '</summary>' +
      (v.myCards || []).map(k => '<div class="mc"><span class="mk">' + esc(k.kind) + '</span><b>' + esc(k.name) + '</b><span class="me">' + esc(k.effect) + '</span></div>').join('') +
      '<div class="mnote">以上是印在牌上的效果。情境與事件裏還有別的，選了才知道。</div>' +
    '</details></div>' +
    (v.locked ? '<div class="locked">🔒 本回合已入分（一回合只可以選一個站）</div>' : '');
}

function promptHTML(p) {
  if (!p) return '';
  if (p.kind === 'info') {
    return '<div class="prompt"><h2>ℹ️ ' + esc(p.title) + '</h2><div class="body">' + esc(p.body) + '</div></div>';
  }
  if (p.kind === 'chosen') {                       // 已選站 → 可以改揀
    return '<div class="prompt"><h2>🧭 ' + esc(p.title) + '</h2>' +
      '<div class="chosenbox"><span class="cv">' + esc(p.body) + '</span>' +
      btn('opt ghost mini', { type: 'station_undo' }, '↩︎ 改選') + '</div>' +
      '<div style="font-size:12px;color:var(--muted);margin-top:9px;font-family:var(--cjk)">' +
      '入分之前都可以改。入了分便要找主持人。</div></div>';
  }
  if (p.kind === 'rush') {                        // 🏊 池邊衝刺：開 Kahoot（QR 喺大螢幕；手機直接撳）
    return '<div class="prompt rush"><h2>🏊 ' + esc(p.title) + '</h2>' +
      '<div class="body">' + esc(p.body) + '</div>' +
      (p.blocked ? '<div class="rushpin">本回合請坐着看</div>' :
        '<div class="rushpin">' + (p.pin ? 'Game PIN　<b>' + esc(p.pin) + '</b>' : (p.link ? '按下面的按鈕直接進入' : 'PIN 請看大螢幕')) + '</div>' +
        '<div class="opts"><a class="opt seal rushbtn" href="' + esc(p.url) + '" target="_blank" rel="noopener">🏊 開 Kahoot' +
        '<span class="s" style="color:#FFE9DD">會在新分頁開啟 Kahoot' + (p.pin ? '，PIN 已自動填上' : (p.link ? '' : '，輸入 PIN 即可')) + '。完成後回到這一頁。</span></a></div>') +
      '</div>';
  }
  if (p.kind === 'bid') {
    const enc = encB(p.current.basket);
    const adds = p.options.map(o => btn('opt', { type: 'bid_add', color: o.value, basket: enc },
      esc(o.label) + '<span class="s">' + esc(o.sub) + '</span>')).join('');
    return '<div class="prompt"><h2>📈 ' + esc(p.title) + '</h2>' +
      '<div class="body">' + esc(p.body) + '</div>' +
      '<div class="bidnow">' + esc(p.current.human) + '　<b>共 ' + p.current.total + ' 枚</b></div>' +
      '<div class="opts">' + adds + '<div class="row2">' +
        btn('opt ghost', { type: 'bid_clear' }, '🧹 清空') +
        btn('opt seal', { type: 'bid_seal', basket: enc }, '✅ 封標（' + p.current.total + '枚）', !p.canSeal) +
      '</div></div></div>';
  }
  const opts = p.options.map(o => btn('opt' + (o.star ? ' star' : ''), actOf(p, o),
    esc(o.label) + (o.sub ? '<span class="s">' + esc(o.sub) + '</span>' : ''))).join('');
  const icon = p.kind === 'station' ? '🧭' : p.kind === 'lookback' ? '🕯' : '📖';
  const inc = ''; // Event options never disclose station benefits before submission.
  const ms = p.mission ? '<div class="mission">🎯 只有你看見：' + esc(p.mission) + '</div>' : '';
  return '<div class="prompt"><h2>' + icon + ' ' + esc(p.title) + '</h2>' +
    (p.body ? '<div class="body">' + esc(p.body) + '</div>' : '') + inc +
    '<div class="opts">' + opts + '</div>' + ms + '</div>';
}

function render() {
  if (!VIEW) return;
  const key = JSON.stringify([VIEW, LOCALPROMPT, LASTRESULT, RESULTROUND, everOK, getOut()]);
  if (key === renderedKey) return; renderedKey = key;
  const opened = [...document.querySelectorAll('#app details')].map(x => x.open);
  const scroll = window.scrollY;
  ACTIONS = [];
  const p = LOCALPROMPT || VIEW.pending;
  const logs = (VIEW.log || []).slice().reverse();
  $('app').innerHTML =
    (everOK ? '' : '<div class="offline">📵 暫時連不上伺服器，顯示的是上一次的紀錄。網絡恢復後會自動更新。</div>') +
    (VIEW.choiceBenefit && !(LASTRESULT||'').includes(VIEW.choiceBenefit) ? '<div class="result"><span class="tag">本回合已解鎖的站點加成</span>'+esc(VIEW.choiceBenefit)+'</div>' : '') +
    (getOut() ? '<div class="offline">📨 有一個操作尚未收到確認。重試會沿用原操作編號，避免重複計分。<button onclick="retryPending()">重試此操作</button><button onclick="clearReviewedOutbox()">主持人已核對：解除待處理</button></div>' : '') +
    stageHTML(VIEW) +
    badgeHTML(VIEW) +
    walletHTML(VIEW) +
    (LASTRESULT && RESULTROUND === VIEW.round
      ? '<div class="result"><span class="tag">' + esc(VIEW.round) + ' · 你的選擇帶來的</span>' + esc(LASTRESULT) + '</div>' : '') +
    (VIEW.message && VIEW.message !== LASTRESULT && VIEW.messageRound === VIEW.round && !(LASTRESULT && RESULTROUND === VIEW.round)
      ? '<div class="result"><span class="tag">' + esc(VIEW.round) + ' 訊息</span>' + esc(VIEW.message) + '</div>' : '') +
    (p ? promptHTML(p) : '<div class="card"><div class="waiting"><span class="dot"></span>' +
       '現在沒有事要你做。<br>留在這一頁——主持人開啟新環節時，幾秒內會自動出現。</div></div>') +
    growthHTML(VIEW) +
    (logs.length ? '<div class="card"><details><summary>📜 ' + esc(VIEW.round) + ' 紀錄（' + logs.length + '）</summary>' +
      logs.slice(0, 8).map(l => '<div class="logrow"><span>' + esc(l.act) + '</span><span>' + esc(l.note) + '</span></div>').join('') +
      '</details></div>' : '');
  document.querySelectorAll('#app details').forEach((x,i) => { x.open = !!opened[i]; });
  if (getOut()) document.querySelectorAll('button[data-act]').forEach(x => x.disabled = true);
  window.scrollTo(0, scroll);
  PREVTOK = Object.fromEntries((VIEW.wallet?.tokens || []).map(t => [t.key, t.count]));
  save();
}

let LASTPOLL = 0;
async function poll() {
  if (busy || polling) return; polling = true; const generation = pollGeneration; LASTPOLL = Date.now();
  try {
    const r = await fetch(BASE + '/me?id=' + encodeURIComponent(ID) + '&t=' + encodeURIComponent(TOKEN), { cache: 'no-store' });
    const d = await r.json();
    if (generation !== pollGeneration) return;
    if (!d.ok) { $('app').innerHTML = '<div class="err">' + esc(d.msg || '連接不上') + '</div>'; return; }
    if(VIEW&&VIEW.gameEpoch!==d.view.gameEpoch){LASTRESULT=null;RESULTROUND=null;LOCALPROMPT=null;try{localStorage.removeItem(SKEY+'_hist');}catch{}}
    else if (VIEW && VIEW.round !== d.view.round) {                                                            // ★ 換回合即清；並把上一回合的快照留在本機（v6：不再寫 Notion）
      LASTRESULT = null; RESULTROUND = null; LOCALPROMPT = null;
      try { const h = JSON.parse(localStorage.getItem(SKEY + '_hist') || '[]');
        const tok = Object.fromEntries((VIEW.wallet?.tokens || []).map(t => [t.key, t.count]));
        if (!h.some(x => x.round === VIEW.round)) { h.push({ round: VIEW.round, ...tok, gold: VIEW.wallet?.gold || 0 }); localStorage.setItem(SKEY + '_hist', JSON.stringify(h)); } } catch {}
    }
    if (!d.view.pending) LOCALPROMPT = null;                                                                  // ★ 伺服器收咗 prompt → 本地都收
    if (d.view.pending && (!VIEW || JSON.stringify(d.view.pending) !== JSON.stringify(VIEW.pending))) LOCALPROMPT = null;
    VIEW = d.view; everOK = true;
    try { const h = JSON.parse(localStorage.getItem(SKEY + '_hist') || '[]'); const srv = (VIEW.history || []).filter(x => String(x.round).includes('而家'));
      const seen = new Set(h.map(x => x.round)); const rest = (VIEW.history || []).filter(x => !String(x.round).includes('而家') && !seen.has(x.round));
      VIEW.history = [...h, ...rest, ...srv]; } catch {}
    render();
    $('status').textContent = '更新於 ' + new Date().toLocaleTimeString('zh-HK');
  } catch {
    if (generation !== pollGeneration) return;
    $('status').textContent = '連線不上，重試中⋯';
    if (VIEW) { everOK = false; render(); }
  } finally { polling = false; }
}

// ═══ v7 寄件匣：網絡不穩時，動作先存本機，每 4 秒重試直至送達 ═══
const OKEY = 'bethesda_player_A1_' + ID + '_outbox'; // Preserve unconfirmed A1 operations for explicit review.
const getOut = () => { try { return JSON.parse(localStorage.getItem(OKEY) || 'null'); } catch { return null; } };
const setOut = v => { try { v ? localStorage.setItem(OKEY, JSON.stringify(v)) : localStorage.removeItem(OKEY); } catch {} };
async function postAct(a, context, operationId) {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(BASE + '/act', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: ID, token: TOKEN, action: a, context, operationId }), signal: ctl.signal }); return await r.json(); }
  finally { clearTimeout(tm); }
}
function applyResp(d) {
  if (d.view) { VIEW = d.view; everOK = true; }
  if (d.text) { LASTRESULT = d.text; RESULTROUND = d.view ? d.view.round : VIEW?.round; }
  if (!d.ok) { LASTRESULT = d.msg || '操作未能確認，請通知主持人。'; RESULTROUND = VIEW?.round; }
  LOCALPROMPT = d.immediate || null;
}
async function act(a) {
  if (busy || getOut()) return;
  if (!VIEW?.actionContext) { LASTRESULT = '請先連線更新目前環節。'; RESULTROUND = VIEW?.round; render(); return; }
  busy = true; pollGeneration++; buzz(12);
  const pending = { operationId:crypto.randomUUID(), a, context: VIEW.actionContext, t: Date.now(), round: VIEW.round, needsReview: true };
  setOut(pending);
  if (!getOut()) { busy = false; alert('無法在此裝置保存操作，尚未送出。請通知主持人。'); return; }
  render();
  try {
    const d = await postAct(a, pending.context, pending.operationId);
    if (d.ok || (!d.needsReview && d.msg && !d.msg.includes('重試'))) setOut(null);
    applyResp(d); render();
  } catch {
    LASTRESULT = '操作結果尚未確認。請按重試，系統會以原操作編號核對，避免重複計分。'; RESULTROUND = VIEW.round; render();
  } finally { busy = false; }
}
async function retryPending(){
 const p=getOut();if(!p||busy)return;
 if(!p.operationId){alert('這是舊版待核對操作，請由主持人核對後處理。');return;}
 busy=true;try{const d=await postAct(p.a,p.context,p.operationId);if(d.ok||(!d.needsReview&&d.msg&&!d.msg.includes('重試')))setOut(null);applyResp(d);render();}catch{LASTRESULT='仍未收到確認，請稍後以同一操作重試。';render();}finally{busy=false;}
}
function clearReviewedOutbox() {
  if (!confirm('主持人已核對錢包與紀錄，並指示解除此待核對操作？這不會補送或撤回任何分數。')) return;
  setOut(null); renderedKey = null; render(); poll();
}
// A 批：未知寫入結果必須由主持人核對；持久自動重試由 B 批處理。

document.addEventListener('pointerdown', e => {
  const b = e.target.closest('button[data-act]');
  if (b && !b.disabled) b.classList.add('pressing');
});
document.addEventListener('pointerup', () => {
  document.querySelectorAll('button.pressing').forEach(b => b.classList.remove('pressing'));
});
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b || b.disabled) return;
  const a = ACTIONS[parseInt(b.dataset.act, 10)];
  if (a) act(a);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
window.addEventListener('pagehide', save);
window.addEventListener('online', poll);

if (!ID || !TOKEN) {
  $('app').innerHTML = '<div class="err">連結不完整。<br>請使用主持人發給你的完整連結。</div>';
} else {
  if (restore()) render();
  poll(); setInterval(() => { if (document.hidden) return; const idle = VIEW && !VIEW.pending && !LOCALPROMPT; if (idle && (Date.now() - LASTPOLL) < 15000) return; poll(); }, 8000);
}
</script>
