<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F0EEE6">
<title>人生手冊 · 我的錢包</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 只載拉丁／希臘字重（幾十 KB）；中文用系統內建襯線體，iOS/Android 都有，唔使等落載 -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* ── Claude 暖調 · 瓦器大理石 ── */
  --paper:#F0EEE6;      /* 米白紙 */
  --paper2:#FAF9F5;     /* 更淺 */
  --clay:#D97757;       /* 陶土（主色）*/
  --clay-deep:#9E4529;
  --clay-soft:#E8C0A8;
  --ink:#141413;        /* 主文字 */
  --ink2:#3D3D3A;
  --muted:#6B6963;
  --faint:#A8A59D;
  --line:rgba(20,20,19,.11);
  --line2:rgba(20,20,19,.06);
  /* 代幣色：暖調、低飽和，喺米白底上睇得清 */
  --g:#4C7A52;--r:#BE5A4C;--p:#7A6099;--y:#9E7016;--b:#43698F;
  --serif:"Cormorant Garamond","Songti TC","Noto Serif CJK TC","Noto Serif TC",serif;
  --cjk:"Songti TC","Noto Serif CJK TC","Noto Serif TC","Source Han Serif TC",
        "PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",serif;
  --ui:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans CJK TC",
       "Microsoft JhengHei",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--ui);color:var(--ink);padding-bottom:34px;
  background-color:var(--paper);
  /* ── 瓦器大理石：暖米白底 + 陶土脈紋，全部 CSS 生成，零圖片 ── */
  background-image:
    radial-gradient(1200px 700px at 82% -14%, rgba(217,119,87,.10), transparent 60%),
    radial-gradient(820px 560px at 4% 16%, rgba(180,87,58,.055), transparent 64%),
    radial-gradient(640px 640px at 46% 108%, rgba(217,119,87,.06), transparent 62%),
    repeating-linear-gradient(72deg,
      transparent 0 26px, rgba(180,87,58,.055) 26px 27px,
      transparent 27px 54px, rgba(20,20,19,.030) 54px 55px,
      transparent 55px 112px),
    repeating-linear-gradient(-54deg,
      transparent 0 44px, rgba(20,20,19,.026) 44px 45px,
      transparent 45px 96px, rgba(217,119,87,.055) 96px 97px,
      transparent 97px 168px),
    repeating-linear-gradient(18deg,
      transparent 0 150px, rgba(180,87,58,.035) 150px 152px, transparent 152px 300px),
    repeating-linear-gradient(-83deg,
      transparent 0 200px, rgba(20,20,19,.018) 200px 201px, transparent 201px 420px),
    linear-gradient(166deg,#FAF9F5 0%,#F2F0E8 40%,#EDEAE0 72%,#F5F2EA 100%);
  background-attachment:fixed;background-size:cover;
}
.wrap{max-width:540px;margin:0 auto;padding:14px 14px 0}

header{text-align:center;padding:10px 0 4px}
.greek{font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--clay-deep);opacity:.85}
h1{font-family:var(--cjk);font-size:22px;font-weight:600;letter-spacing:.2em;margin:4px 0 0;
  text-indent:.2em;color:var(--ink)}
.ripple{height:1px;margin:12px auto 14px;max-width:260px;
  background:linear-gradient(90deg,transparent,rgba(217,119,87,.55),transparent)}

/* ── 大號碼（畀站長睇）── */
.badge{display:flex;align-items:center;justify-content:center;gap:13px;
  background:linear-gradient(140deg,rgba(217,119,87,.13),rgba(232,192,168,.09));
  border:1px solid rgba(217,119,87,.34);border-radius:16px;padding:12px 15px;margin-bottom:12px;
  box-shadow:0 2px 14px rgba(180,87,58,.10)}
.badge .no{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;
  color:var(--clay-deep);letter-spacing:.03em}
.badge .who{text-align:left;line-height:1.35}
.badge .who .n{font-family:var(--cjk);font-size:19px;font-weight:600;color:var(--ink)}
.badge .who .t{font-size:11px;color:var(--muted)}

.card{background:rgba(255,254,250,.72);
  border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  box-shadow:0 1px 3px rgba(20,20,19,.05),0 6px 22px rgba(20,20,19,.045)}
.card h2{font-family:var(--cjk);font-size:15px;font-weight:600;margin:0 0 11px;
  letter-spacing:.05em;color:var(--ink)}
.card h2 .hint{float:right;font-size:11px;color:var(--faint);font-weight:400;letter-spacing:0}

.wrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.rk{font-family:var(--serif);font-size:18px;color:var(--clay-deep);font-weight:600}
.rk small{font-size:11px;color:var(--faint);font-family:var(--ui);font-weight:400}
.toks{display:flex;gap:6px}
.tok{flex:1;text-align:center;background:rgba(240,238,230,.72);border:1px solid var(--line2);
  border-radius:12px;padding:9px 2px;position:relative;overflow:hidden}
.tok::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;opacity:.9}
.tok.k-green::after{background:var(--g)}.tok.k-red::after{background:var(--r)}
.tok.k-purple::after{background:var(--p)}.tok.k-yellow::after{background:var(--y)}
.tok.k-blue::after{background:var(--b)}
.tok .e{font-size:15px;line-height:1.1}
.tok .n{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1;margin-top:1px;color:var(--ink)}
.tok .l{font-size:10px;color:var(--muted);font-family:var(--cjk)}
.tok.mask .n{font-size:15px;color:var(--faint);letter-spacing:.06em}
.meta{display:flex;gap:15px;justify-content:center;margin-top:11px;font-size:13px;
  color:var(--ink2);flex-wrap:wrap;font-family:var(--serif)}
.cardsline{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
  font-size:12.5px;color:var(--muted);line-height:1.85;font-family:var(--cjk)}
.cardsline b{color:var(--ink2);font-weight:600}

.prompt{background:linear-gradient(150deg,rgba(217,119,87,.10),rgba(255,254,250,.86));
  border:1px solid rgba(217,119,87,.32);border-radius:16px;padding:17px;margin-bottom:12px;
  box-shadow:0 2px 5px rgba(20,20,19,.05),0 8px 26px rgba(180,87,58,.08);
  animation:pop .38s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.prompt h2{font-family:var(--cjk);font-size:16.5px;margin:0 0 10px;color:var(--ink)}
.prompt .body{white-space:pre-wrap;line-height:1.9;font-size:15px;font-family:var(--cjk);
  margin-bottom:16px;color:var(--ink2)}
.opts{display:flex;flex-direction:column;gap:9px}
button.opt{width:100%;text-align:left;background:rgba(255,254,250,.92);color:var(--ink);
  border:1px solid var(--line);border-radius:12px;padding:14px 15px;font-size:15.5px;
  font-family:var(--cjk);cursor:pointer;line-height:1.45;transition:transform .1s,background .12s;
  box-shadow:0 1px 2px rgba(20,20,19,.04)}
button.opt:active{transform:scale(.985);background:rgba(232,192,168,.32)}
button.opt .s{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--ui)}
button.opt[disabled]{opacity:.42}
.row2{display:flex;gap:9px}.row2 button.opt{flex:1;text-align:center}
button.seal{background:linear-gradient(180deg,var(--clay),var(--clay-deep));color:#FFF9F5;
  border:none;font-weight:700;box-shadow:0 2px 8px rgba(180,87,58,.28)}
button.ghost{background:transparent;color:var(--muted);box-shadow:none}
.bidnow{background:rgba(240,238,230,.8);border:1px solid var(--line);border-radius:12px;
  padding:12px;text-align:center;font-size:16.5px;margin-bottom:12px;font-family:var(--serif);color:var(--ink)}

.result{background:rgba(255,254,250,.9);border:1px solid var(--line);
  border-left:3px solid var(--clay);border-radius:12px;padding:16px;margin-bottom:12px;
  white-space:pre-wrap;line-height:1.95;font-size:15px;font-family:var(--cjk);
  color:var(--ink2);box-shadow:0 4px 18px rgba(20,20,19,.05);animation:pop .38s ease both}
.result .tag{display:block;font-size:11px;color:var(--clay-deep);margin-bottom:8px;
  letter-spacing:.12em;font-family:var(--ui)}
.waiting{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 12px;
  font-family:var(--cjk);line-height:2}
.waiting .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--clay);margin-right:7px;animation:blink 1.7s ease-in-out infinite}
@keyframes blink{50%{opacity:.22}}

.chartbox{overflow-x:auto;-webkit-overflow-scrolling:touch}
svg.traj{display:block;width:100%;height:auto}
.legend{display:flex;gap:11px;justify-content:center;margin-top:9px;flex-wrap:wrap;
  font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tl{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.tlrow{display:flex;gap:9px;padding:6px 0;font-size:12.5px;align-items:baseline}
.tlrow .rd{font-family:var(--serif);font-size:14px;color:var(--clay-deep);min-width:32px;
  flex:0 0 auto;font-weight:600}
.tlrow .tx{color:var(--ink2);font-family:var(--cjk);line-height:1.55}
.tlrow .tx em{font-style:normal;color:var(--muted)}

details summary{color:var(--muted);font-size:12.5px;cursor:pointer;padding:5px 0;
  list-style:none;font-family:var(--cjk)}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";color:var(--clay)}
details[open] summary::before{content:"▾ "}
.logrow{font-size:12.5px;color:var(--muted);padding:6px 2px;border-bottom:1px dashed var(--line2);
  display:flex;justify-content:space-between;gap:10px;font-family:var(--cjk)}
.err{background:rgba(190,90,76,.10);border:1px solid rgba(190,90,76,.38);color:var(--clay-deep);
  border-radius:12px;padding:14px;text-align:center;font-size:14.5px;margin-bottom:12px;
  line-height:1.75;font-family:var(--cjk)}
.status{text-align:center;font-size:11px;color:var(--faint);margin:14px 0 6px;font-family:var(--serif)}
.locked{text-align:center;font-size:12.5px;color:var(--clay-deep);margin:-4px 0 12px;font-family:var(--cjk)}
.offline{background:rgba(217,119,87,.11);border:1px solid rgba(217,119,87,.36);color:var(--clay-deep);
  border-radius:11px;padding:10px;text-align:center;font-size:12.5px;margin-bottom:12px;font-family:var(--cjk)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="greek">θέλεις ὑγιὴς γενέσθαι;</div>
    <h1>人生手冊</h1>
    <div class="ripple"></div>
  </header>
  <div id="app"></div>
  <div class="status" id="status"></div>
</div>

<script>
// ── ✏️ 只此一行：你嘅 Lambda Function URL ────────────────
const BASE = 'https://pw3jpvywrpggt73vova47hq3la0depya.lambda-url.ap-northeast-1.on.aws';
// ──────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const qp = new URLSearchParams(location.search);
const ID = qp.get('id') || '', TOKEN = qp.get('t') || '';
const SKEY = 'bethesda_player_' + ID;      // 本機救生艇

let VIEW = null, LOCALPROMPT = null, LASTRESULT = null, ACTIONS = [], busy = false, everOK = false;

const esc = s => String(s == null ? '' : s).replace(/[<>&"']/g,
  c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;' }[c]));

// ═══ 救生艇：本機保存／還原（防唔小心 refresh 或熄咗）═══
function save() {
  try {
    localStorage.setItem(SKEY, JSON.stringify({
      view: VIEW, localPrompt: LOCALPROMPT, lastResult: LASTRESULT, ts: Date.now() }));
  } catch {}
}
function restore() {
  try {
    const d = JSON.parse(localStorage.getItem(SKEY) || 'null');
    if (!d || Date.now() - d.ts > 86400000) return false;   // 超過一日就唔還原
    VIEW = d.view; LOCALPROMPT = d.localPrompt; LASTRESULT = d.lastResult;
    return !!VIEW;
  } catch { return false; }
}

// ═══ 掣工廠（action 存陣列，掣只帶 index — 唔用 inline onclick）═══
function btn(cls, action, inner, disabled) {
  const i = ACTIONS.push(action) - 1;
  return '<button class="' + cls + '" data-act="' + i + '"' + (disabled ? ' disabled' : '') + '>' + inner + '</button>';
}
const encB = b => ['green','red','purple','yellow','blue'].map(k => b[k] || 0).join('.');
function actOf(p, o) {
  if (p.kind === 'station') return { type: 'station', station: o.value };
  if (p.kind === 'interactive') return { type: 'interactive', ref: p.ref, choice: o.value };
  if (p.kind === 'any') return { type: 'any_pick', color: o.value, n: p.n };
  return {};
}

function badgeHTML(v) {
  return '<div class="badge"><span class="no">' + esc(v.id) + '</span>' +
    '<span class="who"><span class="n">' + esc(v.name) + '</span><br>' +
    '<span class="t">入分時，同站長講呢個號碼</span></span></div>';
}

function walletHTML(v) {
  const toks = v.wallet.tokens.filter(t => !t.hidden).map(t =>
    '<div class="tok k-' + t.key + (t.masked ? ' mask' : '') + '">' +
      '<div class="e">' + t.emoji + '</div>' +
      '<div class="n">' + (t.masked ? '？？' : t.count) + '</div>' +
      '<div class="l">' + (t.masked ? '' : esc(t.name)) + '</div></div>').join('');
  const meta = [];
  if (v.wallet.gold !== null) meta.push('🥇 ' + v.wallet.gold);
  if (v.wallet.markers) meta.push('🤝 ' + v.wallet.markers);
  meta.push('合共 ' + v.wallet.total + ' 枚');
  const c = v.cards;
  return '<div class="card"><div class="wrow">' +
    '<h2 style="margin:0">👛 我的錢包 <span class="hint">' + esc(v.round) + '</span></h2>' +
    '<span class="rk">' + (v.rank ? '#' + v.rank : '') +
      '<small>' + (v.rank ? ' / ' + v.fieldSize : '') + '</small></span></div>' +
    '<div class="toks">' + toks + '</div>' +
    '<div class="meta">' + meta.map(m => '<span>' + m + '</span>').join('') + '</div>' +
    '<div class="cardsline"><b>性格</b> ' + (esc((c.personality || []).join('、')) || '—') +
      '　<b>原生</b> ' + (esc(c.environment) || '—') + '<br>' +
      '<b>渴求</b> ' + (esc(c.desire) || '—') + '</div></div>' +
    (v.locked ? '<div class="locked">🔒 本回合已入分（一回合只可以揀一個站）</div>' : '');
}

function promptHTML(p) {
  if (!p) return '';
  if (p.kind === 'bid') {
    const enc = encB(p.current.basket);
    const adds = p.options.map(o => btn('opt', { type: 'bid_add', color: o.value, basket: enc },
      esc(o.label) + '<span class="s">' + esc(o.sub) + '</span>')).join('');
    return '<div class="prompt"><h2>📈 ' + esc(p.title) + '</h2>' +
      '<div class="body">' + esc(p.body) + '</div>' +
      '<div class="bidnow">' + esc(p.current.human) + '　<b>共 ' + p.current.total + ' 枚</b></div>' +
      '<div class="opts">' + adds + '<div class="row2">' +
        btn('opt ghost', { type: 'bid_clear' }, '🧹 清空') +
        btn('opt seal', { type: 'bid_seal', basket: enc }, '✅ 封標（' + p.current.total + '枚）', !p.canSeal) +
      '</div></div></div>';
  }
  const opts = p.options.map(o => btn('opt', actOf(p, o),
    esc(o.label) + (o.sub ? '<span class="s">' + esc(o.sub) + '</span>' : ''))).join('');
  const icon = p.kind === 'station' ? '🧭' : p.kind === 'any' ? '🎯' : '📖';
  return '<div class="prompt"><h2>' + icon + ' ' + esc(p.title) + '</h2>' +
    (p.body ? '<div class="body">' + esc(p.body) + '</div>' : '') +
    '<div class="opts">' + opts + '</div></div>';
}

// ═══ 軌跡圖（純 SVG，零外部 library）═══
const SER = [
  { k: 'green', c: '#4C7A52', n: '🟢' }, { k: 'red', c: '#BE5A4C', n: '🔴' },
  { k: 'purple', c: '#7A6099', n: '🟣' }, { k: 'yellow', c: '#9E7016', n: '🟡' },
  { k: 'blue', c: '#43698F', n: '🔵' },
];
function trajHTML(v) {
  const h = (v.history || []).filter(x => x && x.round);
  if (h.length < 2) return '';
  const rn = parseInt(String(v.round).replace(/\D/g, ''), 10) || 1;
  const series = SER.filter(s => s.k !== 'blue' || rn >= 3);      // 🔵 R3 前唔顯示（保密）
  const W = 500, H = 190, PL = 30, PR = 12, PT = 14, PB = 26;
  const maxV = Math.max(4, ...h.map(p => Math.max.apply(null, series.map(s => p[s.k] || 0))));
  const x = i => PL + (W - PL - PR) * (h.length === 1 ? 0.5 : i / (h.length - 1));
  const y = val => PT + (H - PT - PB) * (1 - val / maxV);
  const grid = [0, 0.5, 1].map(f => {
    const yy = PT + (H - PT - PB) * (1 - f);
    return '<line x1="' + PL + '" y1="' + yy + '" x2="' + (W - PR) + '" y2="' + yy +
      '" stroke="rgba(20,20,19,.11)" stroke-width="1"/>' +
      '<text x="' + (PL - 6) + '" y="' + (yy + 4) + '" fill="#6B6963" font-size="10" text-anchor="end">' +
      Math.round(maxV * f) + '</text>';
  }).join('');
  const lines = series.map(s => {
    const pts = h.map((p, i) => x(i).toFixed(1) + ',' + y(p[s.k] || 0).toFixed(1)).join(' ');
    const dots = h.map((p, i) => '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p[s.k] || 0).toFixed(1) +
      '" r="3" fill="' + s.c + '"/>').join('');
    return '<polyline points="' + pts + '" fill="none" stroke="' + s.c +
      '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity=".92"/>' + dots;
  }).join('');
  const xlab = h.map((p, i) => '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) +
    '" fill="#6B6963" font-size="10" text-anchor="middle">' +
    esc(p.round.replace('（而家）', '·今')) + '</text>').join('');
  const leg = series.map(s => '<span><i style="background:' + s.c + '"></i>' + s.n + '</span>').join('');

  const tl = (v.choices || []).slice(-10).map(c => {
    const label = c.act === '🧭選站' ? '去咗 <em>' + esc(c.note) + '</em>'
      : c.act === '💰暗標' ? '暗標出價 <em>' + esc(c.note) + '</em>'
      : c.act === '💰開標' ? '<em>' + esc(c.note) + '</em>'
      : esc(c.act.replace('🎭', '')) + ' — <em>' + esc(c.note) + '</em>';
    return '<div class="tlrow"><span class="rd">' + esc(c.round) + '</span><span class="tx">' + label + '</span></div>';
  }).join('');

  return '<div class="card"><h2>📈 我的軌跡 <span class="hint">代幣點樣行到今日</span></h2>' +
    '<div class="chartbox"><svg class="traj" viewBox="0 0 ' + W + ' ' + H +
      '" preserveAspectRatio="xMidYMid meet" role="img">' + grid + lines + xlab + '</svg></div>' +
    '<div class="legend">' + leg + '</div>' +
    (tl ? '<div class="tl">' + tl + '</div>' : '') + '</div>';
}

function render() {
  if (!VIEW) return;
  ACTIONS = [];
  const p = LOCALPROMPT || VIEW.pending;
  const logs = (VIEW.log || []).slice().reverse();
  $('app').innerHTML =
    (everOK ? '' : '<div class="offline">📵 而家連唔到伺服器，顯示緊上次嘅紀錄。有網會自動更新。</div>') +
    badgeHTML(VIEW) +
    walletHTML(VIEW) +
    (LASTRESULT ? '<div class="result"><span class="tag">最近一次結果</span>' + esc(LASTRESULT) + '</div>' : '') +
    (p ? promptHTML(p) : '<div class="card"><div class="waiting"><span class="dot"></span>' +
       '而家冇嘢要你做。<br>留住呢一版，MC 一開新環節就會自動彈出嚟。</div></div>') +
    trajHTML(VIEW) +
    (logs.length ? '<div class="card"><details><summary>📜 本回合完整紀錄（' + logs.length + '）</summary>' +
      logs.map(l => '<div class="logrow"><span>' + esc(l.act) + '</span><span>' + esc(l.note) + '</span></div>').join('') +
      '</details></div>' : '');
  save();
}

async function poll() {
  if (busy) return;
  try {
    const r = await fetch(BASE + '/me?id=' + encodeURIComponent(ID) + '&t=' + encodeURIComponent(TOKEN), { cache: 'no-store' });
    const d = await r.json();
    if (!d.ok) { $('app').innerHTML = '<div class="err">' + esc(d.msg || '連唔到') + '</div>'; return; }
    if (d.view.pending && (!VIEW || JSON.stringify(d.view.pending) !== JSON.stringify(VIEW.pending))) LOCALPROMPT = null;
    VIEW = d.view; everOK = true; render();
    $('status').textContent = '更新於 ' + new Date().toLocaleTimeString('zh-HK');
  } catch {
    $('status').textContent = '連線唔到，重試中⋯';
    if (VIEW) { everOK = false; render(); }
  }
}

async function act(a) {
  if (busy) return; busy = true;
  document.querySelectorAll('button[data-act]').forEach(b => { b.disabled = true; });
  try {
    const r = await fetch(BASE + '/act', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: ID, token: TOKEN, action: a }) });
    const d = await r.json();
    if (d.view) { VIEW = d.view; everOK = true; }
    if (d.text) LASTRESULT = d.text;
    if (!d.ok && d.msg) LASTRESULT = d.msg;
    LOCALPROMPT = d.immediate || null;
    render();
  } catch {
    LASTRESULT = '網絡唔穩，撳多次。'; render();
  } finally { busy = false; }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b || b.disabled) return;
  const a = ACTIONS[parseInt(b.dataset.act, 10)];
  if (a) act(a);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
window.addEventListener('pagehide', save);
window.addEventListener('online', poll);

if (!ID || !TOKEN) {
  $('app').innerHTML = '<div class="err">條連結唔完整。<br>請用 MC 發俾你嗰條完整連結。</div>';
} else {
  if (restore()) render();          // 先即刻畫返上次嘅嘢（refresh 唔會白畫面）
  poll(); setInterval(poll, 4000);
}
</script>
</body>
</html>
