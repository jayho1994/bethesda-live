<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>人生追尋 · 瓦器 · 大螢幕</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<!-- 池邊衝刺 QR（qrcodejs · 純前端生成；載入失敗會 fallback 顯示大字 PIN ＋ 網址）-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--paper:#F0EEE6;--clay:#D97757;--clay-deep:#9E4529;--ink:#141413;--ink2:#3D3D3A;--muted:#6B6963;
  --g:#4C7A52;--r:#BE5A4C;--p:#7A6099;--y:#9E7016;--b:#43698F;--gold:#C9962B;
  --serif:"Cormorant Garamond","Songti TC","Noto Serif CJK TC",serif;--cjk:"Songti TC","Noto Serif CJK TC","Noto Serif TC","PingFang TC",serif;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#0d0b09;color:var(--ink);font-family:var(--cjk)}
/* ═ 舞台 16:9 ═ */
#stage{position:fixed;inset:0;display:grid;place-items:center}
#frame{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);overflow:hidden;background:var(--paper);
  background-image:
    radial-gradient(1400px 800px at 80% -10%,rgba(217,119,87,.12),transparent 60%),
    radial-gradient(900px 600px at 5% 15%,rgba(158,69,41,.06),transparent 64%),
    repeating-linear-gradient(72deg,transparent 0 30px,rgba(158,69,41,.05) 30px 31px,transparent 31px 62px,rgba(20,20,19,.03) 62px 63px,transparent 63px 128px),
    repeating-linear-gradient(-54deg,transparent 0 50px,rgba(20,20,19,.025) 50px 51px,transparent 51px 110px,rgba(217,119,87,.05) 110px 111px,transparent 111px 190px),
    linear-gradient(166deg,#FAF9F5,#F2F0E8 40%,#EDEAE0 72%,#F5F2EA)}
.layer{position:absolute;inset:0}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s var(--ease)}
.bg.on{opacity:1}
/* ═ 油畫層（Gamma 生成；右三分一留白畀文字）═ */
.art{position:absolute;inset:0;background-size:cover;background-position:left center;opacity:0;transition:opacity 1.1s var(--ease);transform:scale(1.04);}
.art.on{opacity:1;animation:kenburns 26s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1.04) translateX(0)}to{transform:scale(1.09) translateX(-1.5%)}}
.art::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(240,238,230,0) 0%,rgba(240,238,230,.08) 38%,rgba(240,238,230,.86) 56%,rgba(240,238,230,.96) 100%)}
.art.dark::after{background:linear-gradient(90deg,rgba(20,18,16,0) 0%,rgba(20,18,16,.15) 38%,rgba(30,26,22,.86) 56%,rgba(30,26,22,.95) 100%)}
#frame.with-art .slide{padding:6% 6% 8% 50%;align-items:flex-start;text-align:left}
#frame.with-art .slide .body{text-align:left;max-width:100%}
#frame.with-art .slide .rule{margin-left:0}
#frame.with-art .grid{justify-content:flex-start;max-width:100%}
#frame.with-art .st{min-width:18vh;padding:2.2vh 2.4vh}
#frame.with-art .opts{width:100%}
#frame.with-art .podium,#frame.with-art .wts,#frame.with-art .cmp{align-self:center}
#frame.dark-art{color:#F4EDE0}
#frame.dark-art .slide h1,#frame.dark-art .slide .body{color:#F4EDE0}
#frame.dark-art .slide .sub,#frame.dark-art .rank{color:#E8B48F}
#frame.dark-art .opt,#frame.dark-art .st,#frame.dark-art .row{background:rgba(40,34,30,.82);color:#F4EDE0;border-color:rgba(244,237,224,.14)}
#frame.dark-art #stagebar b,#frame.dark-art #foot{color:#F4EDE0}
/* ═ 常駐 overlay ═ */
#stagebar{position:absolute;left:3.2%;top:3.5%;font-family:var(--serif);font-size:1.6vh;color:var(--clay-deep);letter-spacing:.1em;opacity:.85;z-index:30;
  display:flex;gap:1.2vh;align-items:baseline}
#stagebar b{font-size:2vh;font-family:var(--cjk);color:var(--ink)}
#timer{position:absolute;right:3.2%;top:3.5%;font-family:var(--serif);font-size:3.6vh;font-weight:600;color:var(--clay-deep);z-index:30;
  font-variant-numeric:tabular-nums;opacity:0;transition:opacity .5s}
#timer.on{opacity:1}#timer.low{color:#B4332B;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
#foot{position:absolute;left:0;right:0;bottom:2.6%;text-align:center;font-family:var(--serif);font-size:1.5vh;color:var(--muted);letter-spacing:.14em;z-index:30}
#foot .dots{display:inline-flex;gap:.5vh;margin-left:1.5vh;vertical-align:middle}
#foot .dots i{width:.7vh;height:.7vh;border-radius:50%;background:rgba(20,20,19,.16)}
#foot .dots i.on{background:var(--clay);transform:scale(1.4)}
#pin{position:absolute;left:3.2%;bottom:2.6%;font-size:1.5vh;color:var(--clay-deep);z-index:30;opacity:0}
#pin.on{opacity:1}
/* ═ 投影片內容（fallback）═ */
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7% 9%;text-align:center}
.slide h1{font-family:var(--cjk);font-weight:600;color:var(--ink);letter-spacing:.12em;line-height:1.25}
.slide .sub{font-family:var(--serif);color:var(--clay-deep);font-style:italic}
.slide .body{font-family:var(--cjk);color:var(--ink2);white-space:pre-wrap;line-height:1.95;text-align:left;max-width:78%}
.slide .hint{margin-top:4vh;font-family:var(--cjk);font-size:2.6vh;color:var(--clay-deep);letter-spacing:.2em;
  border:1px solid rgba(158,69,41,.4);border-radius:999px;padding:1.2vh 4vh;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55;transform:scale(.98)}}
.rule{width:28vh;height:1px;background:linear-gradient(90deg,transparent,rgba(158,69,41,.6),transparent);margin:2.4vh auto}
/* ═ 入場動畫（按頁種類）═ */
.enter-fade{animation:fadeIn 1.2s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.enter-zoom{animation:zoomIn 1.1s var(--spring) both}
@keyframes zoomIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
.enter-turn{transform-origin:left center;animation:pageTurn 1.1s var(--ease) both}
@keyframes pageTurn{from{opacity:0;transform:perspective(2200px) rotateY(-38deg) translateX(-6%)}60%{opacity:1}to{opacity:1;transform:none}}
.enter-flash{animation:flashIn .9s var(--ease) both}
@keyframes flashIn{0%{opacity:0;filter:brightness(4)}12%{opacity:1;filter:brightness(3)}30%{filter:brightness(1)}100%{opacity:1}}
.enter-shake{animation:shake .8s var(--ease) both}
@keyframes shake{0%{transform:translate(0)}10%{transform:translate(-1.2%,.6%)}25%{transform:translate(1%,-.8%)}40%{transform:translate(-.8%,.5%)}55%{transform:translate(.6%,-.4%)}70%{transform:translate(-.3%,.2%)}100%{transform:none}}
.enter-mist{animation:mist 1.8s var(--ease) both}
@keyframes mist{from{opacity:0;filter:blur(18px)}to{opacity:1;filter:blur(0)}}
.enter-coins{animation:fadeIn 1s both}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:25}
.flash.go{animation:flashOnce .7s ease-out both}
@keyframes flashOnce{0%{opacity:.95}100%{opacity:0}}
/* 逐行浮現 */
.lines>*{opacity:0;animation:lineIn .8s var(--ease) forwards}
@keyframes lineIn{from{opacity:0;transform:translateY(1.6vh)}to{opacity:1;transform:none}}
/* 選站卡 */
.grid{display:flex;gap:2.4vh;flex-wrap:wrap;justify-content:center;margin-top:3vh;max-width:88%}
.st{background:rgba(255,254,250,.85);border:1px solid rgba(20,20,19,.1);border-radius:2.2vh;padding:3vh 3.4vh;min-width:22vh;
  box-shadow:0 .4vh 0 rgba(20,20,19,.08),0 2vh 5vh rgba(20,20,19,.08);opacity:0;animation:cardUp .7s var(--spring) forwards}
@keyframes cardUp{from{opacity:0;transform:translateY(6vh) scale(.94)}to{opacity:1;transform:none}}
.st .e{font-size:5.5vh}.st .n{font-family:var(--cjk);font-size:2.9vh;font-weight:600;margin-top:1vh}.st .t{font-size:1.9vh;color:var(--muted);margin-top:.6vh}
/* 選項 */
.opts{display:flex;flex-direction:column;gap:1.6vh;margin-top:3.4vh;width:64%}
.opt{background:rgba(255,254,250,.9);border:1px solid rgba(20,20,19,.1);border-radius:1.8vh;padding:2vh 3vh;font-family:var(--cjk);font-size:2.9vh;text-align:left;
  box-shadow:0 .4vh 0 rgba(20,20,19,.08);opacity:0;animation:cardUp .6s var(--spring) forwards}
/* 風暴雨線 */
.rain{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.55}
.rain i{position:absolute;top:-10%;width:2px;height:16vh;background:linear-gradient(180deg,transparent,rgba(67,105,143,.55));animation:drop 1.1s linear infinite}
@keyframes drop{to{transform:translateY(130vh)}}
/* 金幣 */
.coins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.coins i{position:absolute;top:-6vh;width:3.2vh;height:3.2vh;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F4CE7A,#C9962B 60%,#8a5f14);
  box-shadow:0 0 1.2vh rgba(201,150,43,.6);animation:coinFall 2.6s cubic-bezier(.4,0,.9,.6) both}
@keyframes coinFall{to{transform:translateY(120vh) rotate(720deg)}}
/* ═ 揭示 ═ */
.podium{display:flex;align-items:flex-end;gap:5vh;margin-top:4vh}
.pd{display:flex;flex-direction:column;align-items:center;opacity:0;animation:cardUp .9s var(--spring) forwards}
.pd .nm{font-family:var(--cjk);font-size:4.2vh;font-weight:600}.pd .sc{font-family:var(--serif);font-size:3vh;color:var(--clay-deep)}
.pd .base{margin-top:1.4vh;border-radius:1.2vh 1.2vh 0 0;display:grid;place-items:start center;padding-top:1vh;font-family:var(--serif);font-size:4vh;font-weight:700;color:rgba(20,20,19,.55)}
.pd1 .base{width:24vh;height:22vh;background:linear-gradient(180deg,#F4CE7A,#C9962B)}
.pd2 .base{width:20vh;height:15vh;background:linear-gradient(180deg,#e6edf2,#B9C3CA)}
.pd3 .base{width:20vh;height:11vh;background:linear-gradient(180deg,#dda87e,#B07A4E)}
.wts{display:flex;gap:2.6vh;margin-top:4vh}
.wt{perspective:1400px;width:15vh;height:19vh}
.wt .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.1s var(--ease)}
.wt.flip .in{transform:rotateY(180deg)}
.wt .f,.wt .k{position:absolute;inset:0;backface-visibility:hidden;border-radius:2vh;display:grid;place-items:center;font-family:var(--serif);font-size:4vh;font-weight:700;
  background:rgba(255,254,250,.94);border:1px solid rgba(20,20,19,.12);box-shadow:0 .4vh 0 rgba(20,20,19,.08),0 2vh 5vh rgba(20,20,19,.1)}
.wt .f{font-size:6vh}.wt .k{transform:rotateY(180deg);color:var(--clay-deep)}
.wt.blue .k{background:linear-gradient(160deg,#eaf1fb,#cfe0f5);color:#2c4f75;font-size:5vh;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 5vh rgba(67,105,143,.55)}}
.big{font-family:var(--cjk);font-size:9vh;font-weight:700;letter-spacing:.14em;opacity:0;animation:zoomIn 1.2s var(--spring) forwards}
.rank{font-family:var(--serif);font-size:5vh;color:var(--clay-deep);opacity:0;animation:fadeIn 1s .3s forwards}
.cmp{display:flex;gap:8vh;margin-top:4vh}
.col{display:flex;flex-direction:column;gap:1.4vh;min-width:30vh}
.col h3{font-family:var(--serif);font-size:2.6vh;color:var(--muted);letter-spacing:.14em;font-weight:500;text-align:center}
.row{background:rgba(255,254,250,.9);border:1px solid rgba(20,20,19,.1);border-radius:1.4vh;padding:1.5vh 2.4vh;font-family:var(--cjk);font-size:2.8vh;text-align:left;
  display:flex;gap:2vh;align-items:baseline;opacity:0;animation:cardUp .7s var(--spring) forwards}
.row b{font-family:var(--serif);color:var(--clay-deep);min-width:3.6vh}
.row.up{background:linear-gradient(160deg,#eaf1fb,#dbe8f7);border-color:rgba(67,105,143,.4)}
.row.up::after{content:"▲";color:#2c4f75;margin-left:auto}
.row.down::after{content:"▼";color:var(--muted);margin-left:auto}
/* ═ 池邊衝刺（Kahoot QR）═ */
.rushwrap{display:flex;gap:6vh;align-items:center;justify-content:center;margin-top:3vh}
.qrbox{background:#FFFDF9;border:1px solid rgba(20,20,19,.12);border-radius:2.4vh;padding:2.4vh;box-shadow:0 .5vh 0 rgba(20,20,19,.08),0 2.4vh 6vh rgba(20,20,19,.14);
  opacity:0;animation:cardUp .8s var(--spring) forwards;display:grid;place-items:center}
.qrbox img,.qrbox canvas{width:38vh!important;height:38vh!important;display:block}
.qrbox .nourl{width:38vh;height:38vh;display:grid;place-items:center;text-align:center;font-family:var(--cjk);font-size:2.6vh;color:var(--muted);line-height:1.8}
.rushinfo{display:flex;flex-direction:column;gap:1.6vh;text-align:left;font-family:var(--cjk)}
.rushinfo .join{font-family:var(--serif);font-size:3.4vh;color:var(--clay-deep);letter-spacing:.06em}
.rushinfo .pinlbl{font-size:2.2vh;color:var(--muted);letter-spacing:.3em}
.rushinfo .pin{font-family:var(--serif);font-size:11vh;font-weight:700;color:#2c4f75;letter-spacing:.12em;line-height:1;font-variant-numeric:tabular-nums}
.rushinfo .pin.none{font-size:4vh;color:var(--muted);font-weight:500;letter-spacing:.06em;font-family:var(--cjk)}
.rushinfo .steps{font-size:2.4vh;color:var(--ink2);line-height:1.9;white-space:pre-wrap}
.rushinfo .prize{font-family:var(--serif);font-size:2.8vh;color:var(--gold);margin-top:.6vh}
#frame.with-art .rushwrap{justify-content:flex-start;gap:4vh}
#frame.with-art .qrbox img,#frame.with-art .qrbox canvas,#frame.with-art .qrbox .nourl{width:30vh!important;height:30vh!important}
#frame.with-art .rushinfo .pin{font-size:8vh}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(67,105,143,.35)}100%{box-shadow:0 0 0 3vh rgba(67,105,143,0)}}
.qrbox.live{animation:cardUp .8s var(--spring) forwards,ripple 2.2s ease-out 1s infinite}
/* ═ v7：群體目標／結算 ═ */
.goal{margin-top:3vh;max-width:80%;background:rgba(67,105,143,.10);border:1px solid rgba(67,105,143,.4);border-radius:1.6vh;padding:1.8vh 3vh;font-family:var(--cjk);font-size:2.7vh;line-height:1.7;text-align:left;opacity:0;animation:cardUp .8s var(--spring) .4s forwards}
.goal b{display:block;font-size:1.9vh;letter-spacing:.3em;color:#2c4f75;margin-bottom:.6vh}
.big.ok{color:#2c6b3f}.big.no{color:#8a2f24}
#frame.dark-art .goal{background:rgba(40,34,30,.82);border-color:rgba(244,237,224,.2);color:#F4EDE0}
/* Board overlay */
#board{position:absolute;inset:0;border:0;opacity:0;pointer-events:none;transition:opacity 1s var(--ease);z-index:40;background:#0B1F2A}
#board.on{opacity:1;pointer-events:auto}
#status{position:absolute;right:3.2%;bottom:2.6%;font-size:1.4vh;color:var(--muted);z-index:30;font-family:var(--serif)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
.update-only *{animation:none!important;opacity:1!important}

/* C1: readable depth, quiet motion, stable content geometry. */
:root{--cjk:"Noto Serif TC","Songti TC",serif}
#frame{isolation:isolate;background:#171713}
#frame::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(8,12,12,.16),transparent 52%)}
#content{z-index:3}.slide .body{max-width:76ch;line-height:1.8;text-wrap:pretty}.slide h1{text-wrap:balance;line-height:1.35}.reveal-question h1{font-size:6.8vh!important}.reveal-question .body{font-size:3.4vh;line-height:2;margin-top:4vh}.storm-still .body{max-width:36em;font-size:3.2vh}.opts{gap:1.4vh}.opt{line-height:1.55!important}.slide{overflow-y:auto;scrollbar-width:thin}.with-art .body{text-shadow:none}.stagger{will-change:auto}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.wt .in{transition:none!important}}
#frame.ranking-layout .slide{padding:7% 8%;align-items:center;text-align:center;background:rgba(240,238,230,.87)}
#frame.with-art .reveal-question h1{font-size:5vh!important}
#status[data-art-missing]:not([data-art-missing=""])::after{content:" · " attr(data-art-missing);color:#a33}
#stagebar{background:rgba(245,240,230,.92);border-radius:20px;padding:5px 12px;color:#743821}#frame.dark-art #stagebar{background:#1e1a16;color:#dfcba9;opacity:1}

/* R3: layered cinematic space, 2.5D perspective; no continuous paint filters. */
#frame{background:#201b16;perspective:1500px}
.art.on{animation:space-arrive 1.3s cubic-bezier(.22,1,.36,1) both;transform-origin:35% 52%}
.art::after,.art.dark::after{background:linear-gradient(90deg,#17130d05 0%,#17130d0c 30%,#17130d85 46%,#17130deb 68%,#17130df5 100%)}
#frame::after{content:"";position:absolute;inset:0;pointer-events:none;border:1.3vh solid #110e0b44;box-shadow:inset 0 0 10vh #09070450;z-index:26}
#frame.with-art .slide{padding:7% 5% 8% 49%}
#frame.with-art .slide h1{letter-spacing:.08em;line-height:1.4;text-shadow:0 4px 24px #08070455}
#frame.dark-art .slide .sub,#frame.dark-art .slide .hint,#frame.dark-art .st .t{color:#d2b990}
#frame.dark-art .st,#frame.dark-art .opt{border-radius:2px;background:#241d16dd;border:1px solid #b79a6350;box-shadow:0 2px 0 #b79a6320,0 14px 25px #0004}
#frame.dark-art .st .e{font-size:3.6vh}#frame.with-art .st{min-width:15vh;padding:1.5vh 1.8vh}.grid{gap:1.4vh}
#frame.dark-art .goal{border-radius:2px;border-left:2px solid #be9d64;background:#27221be8;font-size:2.25vh;line-height:1.6}
#frame.dark-art .goal b{color:#d2b990}.rain,.coins{display:none}
.enter-fade,.enter-zoom,.enter-turn,.enter-flash,.enter-shake,.enter-mist,.enter-coins{animation:spatial-copy .9s cubic-bezier(.22,1,.36,1) both}
@keyframes space-arrive{from{opacity:0;transform:scale(1.12) translateX(-2%)}to{opacity:1;transform:scale(1.01)}}
@keyframes spatial-copy{from{opacity:0;transform:translate3d(34px,10px,0)}to{opacity:1;transform:none}}
#reviewControls{position:fixed;top:8px;right:12px;z-index:2000;display:flex;gap:5px;align-items:center;font:13px sans-serif;background:#211a14e8;padding:7px;border:1px solid #a88b5360;color:#eee4cf}
#reviewControls button,#reviewControls select{font:inherit;color:#eee4cf;background:#3a3025;border:1px solid #927c5555;padding:7px;cursor:pointer}#reviewControls select{max-width:30vw}
#reviewMessage{position:fixed;top:62px;right:12px;z-index:2100;max-width:380px;background:#f4ecda;color:#36281c;padding:18px;font:16px/1.8 sans-serif;box-shadow:0 12px 38px #0005}
#reviewMessage[hidden],#reviewControls [hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.art.on,.enter-fade,.enter-zoom,.enter-turn,.enter-flash,.enter-shake,.enter-mist,.enter-coins{animation:none!important;transform:none!important;opacity:1}.art{transition:none}}
#foot{display:flex;align-items:center;justify-content:center;gap:1.1vh;font-family:var(--cjk);letter-spacing:.08em}.journey-stop{opacity:.4;display:flex;gap:.7vh;align-items:center}.journey-stop i{font-family:var(--serif);font-size:1.3vh}.journey-stop.current{opacity:1;color:#ebc58a}.journey-line{width:3vh;height:1px;background:#baa38466}
/* Continuous camera move: environment, foreground and copy have separate depths. */
.art.on{animation:gallery-camera 1.65s cubic-bezier(.16,1,.3,1) both}
@keyframes gallery-camera{from{opacity:.2;transform:perspective(1600px) translate3d(-2.5%,1%,150px) scale(1.16)}to{opacity:1;transform:perspective(1600px) translate3d(0,0,0) scale(1.01)}}
.depth-portal{position:absolute;inset:7% 4% 5%;border:1.5vh solid #9d7e4b66;box-shadow:0 0 0 3vh #19130c66,inset 0 0 0 1px #e3c79633;pointer-events:none;z-index:2;opacity:0;transform-origin:35% 45%}
.depth-portal.travel{animation:pass-door 1.4s cubic-bezier(.16,1,.3,1) both}
@keyframes pass-door{0%{opacity:0;transform:scale(.72) translateX(-4%)}20%{opacity:.75}100%{opacity:0;transform:scale(1.55) translateX(-8%)}}
.scene-memory{position:absolute;left:3.5%;bottom:8%;width:18%;aspect-ratio:1;background:url('art/memory-objects.png');background-size:300% 200%;box-shadow:0 20px 45px #0008;border:1px solid #bd9b5e60;opacity:0;pointer-events:none;z-index:2;transform:perspective(800px) rotateY(12deg) rotateZ(-3deg)}

<script>
// ── ✏️ Lambda URL ──
const BASE = 'https://pw3jpvywrpggt73vova47hq3la0depya.lambda-url.ap-northeast-1.on.aws';
const SLIDES_DIR = 'slides/';        // Canva 匯出 PNG 放呢度：slides/S03_R1_sit.png；揭示：slides/S25_R6_reveal_p3.png
// ── 油畫底圖（Gamma 生成，油畫風、冇真人）。本地 art/<key>.jpg 優先，冇就用 CDN ──
function artKeyFor(s, st) { return s.kind==='title'?'title':s.round||'R6'; }
// ─────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
let CUR = null, LOCAL = null, PINNED = false, LAST = null, timerEnd = 0, timerTick = null, bgFlip = false, showVersion = 0, polling = false, displayedPage = null, artReady = false;

const ENTER = { title: 'enter-fade', round: 'enter-zoom', choose: 'enter-zoom', situation: 'enter-turn', event: 'enter-flash', aftermath: 'enter-mist', storm: 'enter-shake', auction: 'enter-coins', reveal: 'enter-fade', rush: 'enter-zoom', wind: 'enter-mist', lookback: 'enter-fade', settle: 'enter-zoom' };
const TOK = [['green', '🟢', '事業'], ['red', '🔴', '關係'], ['purple', '🟣', '內在'], ['yellow', '🟡', '享樂'], ['blue', '🔵', '信仰']];

// ── 嘗試 Canva 底圖；冇就 fallback ──
function setBg(url, version) {
  const a = $('bgA'), b = $('bgB'); const next = bgFlip ? a : b, prev = bgFlip ? b : a; bgFlip = !bgFlip;
  if (!url) { next.classList.remove('on'); prev.classList.remove('on'); return Promise.resolve(false); }
  return new Promise(res => { const img = new Image(); img.onload = () => { if(version!==showVersion){res(false);return;} next.style.backgroundImage = `url(${url})`; next.classList.add('on'); prev.classList.remove('on'); res(true); };
    img.onerror = () => { if(version!==showVersion){res(false);return;} next.classList.remove('on'); prev.classList.remove('on'); res(false); }; img.src = url; });
}
let artFlip = false;
function loadImg(url) { return new Promise(res=>{const i=new Image();const t=setTimeout(()=>res(false),15000);i.onload=()=>{clearTimeout(t);res(true)};i.onerror=()=>{clearTimeout(t);res(false)};i.src=url;}); }
async function setArt(key, version) {
  const a = $('artA'), b = $('artB'); const next = artFlip ? a : b, prev = artFlip ? b : a; artFlip = !artFlip;
  const local = key==='title'?'art/passage.png':'art/life-scenes.png';
  const cell=Math.max(0,Math.min(5,Number((key.match(/R([1-6])/)||[])[1]||6)-1));
  next.style.backgroundSize=key==='title'?'cover':'200% 300%';
  next.style.backgroundPosition=key==='title'?'center':`${cell%2*100}% ${Math.floor(cell/2)*50}%`;
  const url=(await loadImg(local))?local:null;
  $('status').dataset.artMissing=url?'':'油畫未能載入，文字仍可使用。';
  if(version!==showVersion)return false;
  if (!url) { next.classList.remove('on'); prev.classList.remove('on'); return false; }
  next.style.backgroundImage = `url(${url})`; next.classList.add('dark'); next.classList.add('on'); prev.classList.remove('on');
  return true;
}
const stagger = (sel, base = .08) => document.querySelectorAll(sel).forEach((el, i) => el.style.animationDelay = (base * i + .15) + 's');

// ── 各頁 fallback HTML ──
function html(s, st) {
  const k = s.kind, rd = st.revealData || {}, rv = st.reveal || 0;
  if (k === 'title') return `<div class="slide"><div class="sub" style="font-size:3.4vh">你正在用甚麼，衡量自己的一生？</div><div class="rule"></div><h1 style="font-size:6vh;white-space:nowrap">人生追尋 · 瓦器</h1><div class="rule"></div><div class="sub" style="font-size:2.4vh;letter-spacing:.3em">提摩太團契 · 秋令營 2026</div></div>`;
  if (k === 'round') return `<div class="slide lines"><div class="sub" style="font-size:3vh;letter-spacing:.3em">${esc(s.round)}</div><h1 style="font-size:11vh">${esc(s.title)}</h1><div class="sub" style="font-size:4vh">${esc(s.sub)}</div><div class="rule"></div><div class="body" style="font-size:3vh;text-align:center">${esc(s.body)}</div></div>`;
  if (k === 'choose') return `<div class="slide"><div class="sub" style="font-size:2.4vh;letter-spacing:.3em">${esc(s.round)}</div><h1 style="font-size:6.5vh">${esc(s.title)}</h1><div class="sub" style="font-size:2.6vh;margin-top:1vh">${esc(s.sub)}</div>
    <div class="grid">${(s.items || []).map(it => `<div class="st"><div class="e">${it.emoji}</div><div class="n">${esc(it.name)}</div><div class="t">${esc(it.task)}</div></div>`).join('')}</div>
    ${s.group ? `<div class="goal"><b>👥 群體目標</b>${esc(s.group)}</div>` : ''}
    ${s.hint ? `<div class="hint">🧭 ${esc(s.hint)}</div>` : ''}</div>`;
  if (k === 'settle') { const r = s.settle; return `<div class="slide"><div class="sub" style="font-size:2.6vh;letter-spacing:.3em">${esc(s.round)} · ⚖️ 結算</div>
    ${s.group ? `<div class="goal" style="margin-top:2vh"><b>👥 群體目標</b>${esc(s.group)}</div>` : ''}
    ${r ? `<div class="big ${r.ok ? 'ok' : 'no'}" style="font-size:12vh;margin-top:3vh">${r.ok ? '達成' : '未達成'}</div><div class="rank" style="font-size:3vh">${esc(r.text)}</div>` : `<div class="rank" style="margin-top:6vh">結算中⋯</div>`}

    <div class="body" style="font-size:3.4vh;text-align:center;max-width:70%">${esc(s.body)}</div>
    <div class="big" style="font-size:5vh;margin-top:3vh;letter-spacing:.3em">📱 請看手機</div><div class="hint">${esc(s.sub)}</div></div>`;
  if (['situation', 'event', 'aftermath'].includes(k)) return `<div class="slide"><div class="sub" style="font-size:2.4vh;letter-spacing:.3em">${k === 'situation' ? '📖 情境' : k === 'event' ? '⚡ 事件' : '🌫 風暴之後'}</div><h1 style="font-size:7vh;margin:1.2vh 0 2vh">${esc(s.title)}</h1>
    <div class="body lines" style="font-size:2.9vh">${esc(s.body).split('\n').filter(x => x.trim()).map(l => `<div>${l}</div>`).join('')}</div>
    <div class="opts">${(s.choices || []).map(c => `<div class="opt">${esc(c)}</div>`).join('')}</div><div class="hint">${esc(s.sub)}</div></div>`;
  if (k === 'wind') return `<div class="slide lines"><div class="sub" style="font-size:2.6vh;letter-spacing:.3em">${esc(s.round)} · 🌬</div><h1 style="font-size:9vh">${esc(s.title)}</h1><div class="sub" style="font-size:3vh">${esc(s.sub)}</div><div class="rule"></div>
    <div class="body" style="font-size:3vh;text-align:center">${esc(s.body)}</div>
    <div class="grid" style="margin-top:3vh">${(s.items || []).map(n => `<div class="st"><div class="n" style="font-size:3.6vh;margin-top:0">${esc(n)}</div></div>`).join('')}</div>
    <div class="hint">📱 你的風向，在手機上</div></div>`;
  if (k === 'lookback') return `<div class="slide"><div class="sub" style="font-size:2.4vh;letter-spacing:.3em">${esc(s.round)} · 🕯</div><h1 style="font-size:8vh;margin:1.2vh 0 2vh">${esc(s.title)}</h1>
    <div class="body lines" style="font-size:3.2vh;text-align:center">${esc(s.body).split('\n').filter(x => x.trim()).map(l => `<div>${l}</div>`).join('')}</div><div class="hint">${esc(s.sub)}</div></div>`;
  if(k==='storm')return `<div class="slide storm-still"><div class="sub">人生的風暴</div><h1>${esc(s.title)}</h1><div class="rule"></div><div class="body">${esc(s.body)}</div></div>`;
  if (k === 'auction') return `<div class="coins">${Array.from({ length: 28 }, (_, i) => `<i style="left:${(i * 3.6) % 100}%;animation-delay:${(i % 7) * .22}s"></i>`).join('')}</div>
    <div class="slide lines"><h1 style="font-size:10vh">${esc(s.title)}</h1><div class="rule"></div><div class="body" style="font-size:3.4vh;text-align:center">${esc(s.body)}</div></div>`;
  if (k === 'rush') {                                                     // 🏊 池邊衝刺：QR ＋ PIN（由 /state.kahoot 帶入）
    const kh = st.kahoot || {}; const pin = kh.pin || '';
    return `<div class="slide"><div class="sub" style="font-size:2.6vh;letter-spacing:.3em">🏊 池邊衝刺 · ${esc(s.round)}</div>
      <h1 style="font-size:7vh;margin:1vh 0 0">倒數開始</h1>
      <div class="rushwrap">
        <div class="qrbox ${pin ? 'live' : ''}" id="qrbox"><div class="nourl">QR 生成中⋯</div></div>
        <div class="rushinfo">
          <div class="join">📱 掃 QR${kh.link ? '，直接進入' : `，或到 <b>${esc(kh.join || 'kahoot.it')}</b>`}</div>
          ${kh.link ? '' : `<div class="pinlbl">GAME PIN</div><div class="pin ${pin ? '' : 'none'}">${pin ? esc(pin) : '聽主持人讀出'}</div>`}
          <div class="steps">${esc(s.body)}</div>
          <div class="prize">${esc(s.sub)}</div>
        </div>
      </div></div>`;
  }
  if (k === 'reveal') {
    if (rv <= 1) return `<div class="slide"><div class="big">遊戲完結</div><div class="rank">六個回合。一個人生。</div></div>`;
    if(rv===8)return `<div class="slide reveal-question"><div class="sub">第二層揭示</div><h1>如果連信仰，<br>也成了得分的方法呢？</h1><div class="body">我們是否只是把上帝，<br>放進另一個需要經營的範疇？</div></div>`;
    if(rv===9)return `<div class="slide reveal-question"><h1>如果醫治，<br>從來不在池子裏呢？</h1><div class="rule"></div><div class="body">ἄνθρωπον οὐκ ἔχω<br>我沒有人。</div></div>`;
    if(rv>=10)return `<div class="slide reveal-question"><h1>今晚，我們去到那個池邊。</h1><div class="body">現在，拿回你的瓦器。<br>把你留下的、失去的、捨不得的，<br>一一加上去。</div></div>`;
    if (rv === 2) { const p = rd.public3 || []; const pd = (x, c, m) => x ? `<div class="pd ${c}"><div class="nm">${esc(x.name)}</div><div class="sc">${x.n} 枚</div><div class="base">${m}</div></div>` : '';
      return `<div class="slide"><div class="sub" style="font-size:2.8vh;letter-spacing:.3em">公開榜 · 按代幣總數</div><div class="podium">${pd(p[1], 'pd2', 2)}${pd(p[0], 'pd1', 1)}${pd(p[2], 'pd3', 3)}</div></div>`; }
    if (rv === 3) { const w = rd.weights || {}; return `<div class="slide"><div class="big" style="font-size:6vh">但是——</div><div class="rank" style="font-size:2.8vh;letter-spacing:.3em">每一種代幣，重量並不一樣</div>
      <div class="wts">${TOK.map(([k2, e, n]) => `<div class="wt ${k2 === 'blue' ? 'blue' : ''}" data-k="${k2}"><div class="in"><div class="f">${e}</div><div class="k">×${w[k2] ?? '?'}</div></div></div>`).join('')}</div></div>`; }
    if (rv >= 4 && rv <= 6) { const i = 6 - rv; const x = (rd.true3 || [])[i]; return `<div class="slide"><div class="rank">真榜 第 ${i + 1} 名</div><div class="big">${x ? esc(x.name) : '⋯'}</div><div class="rank" style="font-size:3.4vh">${x ? `${x.s} 分 · ${x.n} 枚` : ''}</div></div>`; }

      <div class="col"><h3>公開榜</h3>${c.public.map((n, i) => `<div class="row"><b>${i + 1}</b>${esc(n)}</div>`).join('')}</div>
      <div class="col"><h3>真榜</h3>${c.true.map((n, i) => { const was = pubIdx[n]; const cls = was === undefined || was > i ? 'up' : was < i ? 'down' : ''; return `<div class="row ${cls}"><b>${i + 1}</b>${esc(n)}</div>`; }).join('')}</div></div></div>`;
  }

}

let displayedHasBg=false;
async function show(st, force) {
  const s = st.slide; if (!s) return;
  const key = JSON.stringify([s, st.reveal, st.mode, st.kahoot, st.revealData]);
  if (!force && key === LAST && artReady) return; LAST = key;
  const version=++showVersion;
  const pageKey=`${s.id}|${st.reveal}`;const changedPage=pageKey!==displayedPage;
  $('board').classList.toggle('on', st.mode === 'board' && !st.preview);
  const bgUrl = SLIDES_DIR + 'C1_' + s.id + (s.kind === 'reveal' ? `_p${st.reveal || 1}` : '') + '.png';
  // 同頁資料更新不再等圖片，也不重新開始倒數。
  let hasBg=displayedHasBg,hasArt=artReady;
  if(changedPage){
    hasBg=await setBg(null,version);if(version!==showVersion)return;
    hasArt=await setArt(hasBg?'__none__':artKeyFor(s,st),version);if(version!==showVersion)return;
    artReady=hasArt;displayedHasBg=hasBg;
  }
  const artKey=artKeyFor(s,st);
  $('frame').classList.toggle('with-art', hasArt);
  $('frame').classList.toggle('dark-art', hasArt);
  $('frame').classList.toggle('ranking-layout',s.kind==='reveal'&&st.reveal<8);
  $('frame').classList.toggle('dense-layout',['choose','wind','aftermath'].includes(s.kind));
  if(changedPage){
    const portal=$('depthPortal');portal.classList.remove('travel');void portal.offsetWidth;portal.classList.add('travel');
    const relic=$('sceneMemory');const cell=Math.max(0,Math.min(5,Number((s.round||'R1').slice(1))-1));
    relic.style.backgroundPosition=`${cell%3*50}% ${cell<3?0:100}%`;
    relic.classList.toggle('visible',s.kind!=='title'&&s.kind!=='reveal');
    relic.classList.remove('arrive');void relic.offsetWidth;relic.classList.add('arrive');
  }
  const c = $('content'); c.className = 'layer ' + (changedPage ? (ENTER[s.kind] || 'enter-fade') : 'update-only');
  if (false) { $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go'); }
  c.innerHTML = html(s, st);   // 有 Canva 底圖就唔畫 fallback（揭示頁／衝刺頁例外：數據／QR 要 overlay）
  // Ranking pages retain their opaque contrast layer.
  if (s.kind === 'rush') drawQR(st.kahoot || {});
  stagger('.lines>*', .22); stagger('.st', .1); stagger('.opt', .14); stagger('.pd', .35); stagger('.row', .12);
  if (s.kind === 'reveal' && st.reveal === 3) { if(!changedPage)c.querySelectorAll('.wt').forEach(el=>el.classList.add('flip'));else setTimeout(()=>{if(version!==showVersion)return;c.querySelectorAll('.wt').forEach((el,i)=>setTimeout(()=>{if(version===showVersion)el.classList.add('flip');},500+i*450));},900); }
  $('stagebar').innerHTML = s.stage?.stage ? `<span>${esc(s.round)}</span><b>${esc(s.stage.icon)} ${esc(s.stage.stage)}</b><span>${esc(s.stage.age)} · ${esc(s.stage.tag)}</span>` : '';
  const dots = Array.from({ length: s.total }, (_, i) => `<i class="${i === s.seq ? 'on' : ''}"></i>`).join('');
  $('foot').innerHTML = ['少年','大學','初職','建立','風暴','回望'].map((name,i)=>`<span class="journey-stop ${s.round==='R'+(i+1)?'current':''}"><i>${String(i+1).padStart(2,'0')}</i>${name}</span>`).join('<span class="journey-line"></span>');
  if(changedPage)startTimer(s.kind==='reveal'?0:st.deadline?Math.max(0,(st.deadline-st.ts)/1000):s.timer);displayedPage=pageKey;
}
// ── 池邊衝刺 QR：qrcodejs 有就畫；冇（CDN 失敗）就退回顯示網址大字 ──
function drawQR(kh) {
  const box = $('qrbox'); if (!box) return;
  const url = kh.url || 'https://kahoot.it/';
  box.innerHTML = '';
  if (typeof QRCode === 'undefined') { box.innerHTML = `<div class="nourl">QR 載入失敗<br><b>${esc(kh.join || 'kahoot.it')}</b><br>輸入 PIN 即可</div>`; return; }
  try { new QRCode(box, { text: url, width: 640, height: 640, correctLevel: QRCode.CorrectLevel.M, colorDark: '#141413', colorLight: '#FFFDF9' }); }
  catch { box.innerHTML = `<div class="nourl"><b>${esc(kh.join || 'kahoot.it')}</b><br>輸入 PIN 即可</div>`; }
}
function startTimer(sec) {
  clearInterval(timerTick); const t = $('timer');
  if (!sec) { t.classList.remove('on', 'low'); return; }
  timerEnd = Date.now() + sec * 1000; t.classList.add('on'); t.classList.remove('low');
  const tick = () => { const left = Math.max(0, Math.round((timerEnd - Date.now()) / 1000)); t.textContent = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`; if (left <= 15) t.classList.add('low'); if (left <= 0) clearInterval(timerTick); };
  tick(); timerTick = setInterval(tick, 500);
}
async function poll() {
  if(polling)return;polling=true;
  try { const r = await fetch(BASE + '/state', { cache: 'no-store' }); const st = await r.json();if(!r.ok||!st.slide)throw new Error(st.msg||'狀態讀取失敗'); CUR = st;
    $('status').textContent = `同步 ${new Date().toLocaleTimeString('zh-HK')}`;
    if (!PINNED) await show(st);
  } catch { $('status').textContent = '連線不上，重試中'; } finally { polling=false; }
}
let PREVIEW=[], previewIndex=0;
function previewMove(n){if(!PREVIEW.length)return;previewIndex=Math.max(0,Math.min(PREVIEW.length-1,n));PINNED=true;LOCAL=previewIndex;$('pin').classList.add('on');$('pin').textContent='主持人預覽 · 示例排名';$('previewSelect').value=String(previewIndex);show(PREVIEW[previewIndex],true);}
function previewMessage(text){$('reviewMessage').textContent=text;$('reviewMessage').hidden=false;}
$('openPreview').onclick=()=>{const box=$('reviewMessage');if(!box.hidden){box.hidden=true;return;}previewMessage('請在 Telegram 主持人控制台輸入 /preview，然後開啟收到的預覽連結。可逐頁查看，不會推進正式遊戲。');};
$('previewPrev').onclick=()=>previewMove(previewIndex-1);$('previewNext').onclick=()=>previewMove(previewIndex+1);$('previewSelect').onchange=e=>previewMove(Number(e.target.value));
$('previewLive').onclick=()=>{PINNED=false;$('pin').classList.remove('on');if(CUR)show(CUR,true);};
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.key==='Escape'){$('previewLive').click();$('reviewMessage').hidden=true;}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){if(PREVIEW.length)previewMove(previewIndex+(e.key==='ArrowRight'?1:-1));else $('openPreview').click();}});
async function loadPreview(){const token=new URLSearchParams(location.hash.slice(1)).get('preview');if(!token)return;history.replaceState(null,'',location.pathname+location.search);PINNED=true;
 try{const r=await fetch(BASE+'/preview',{headers:{Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok||!d.pages?.length)throw Error(d.msg||'預覽未能載入');PREVIEW=d.pages;
 for(const id of ['previewPrev','previewSelect','previewNext','previewLive'])$(id).hidden=false;
 $('previewSelect').innerHTML=PREVIEW.map((p,i)=>`<option value="${i}">${i+1}/${PREVIEW.length} · ${esc(p.slide.round||'開場')} ${esc(p.slide.title)}${p.reveal?' · '+p.reveal:''}</option>`).join('');previewMove(0);
 }catch(e){PINNED=false;previewMessage(e.message);}}
loadPreview();
poll(); setInterval(poll, 2000);   // v6：狀態小、快取短，2 秒一輪
</script>
