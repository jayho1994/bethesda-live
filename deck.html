<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>人生追尋 · 畢士大版 · 大螢幕</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F0EEE6;--clay:#D97757;--clay-deep:#9E4529;--ink:#141413;--ink2:#3D3D3A;--muted:#6B6963;
  --g:#4C7A52;--r:#BE5A4C;--p:#7A6099;--y:#9E7016;--b:#43698F;--gold:#C9962B;
  --serif:"Cormorant Garamond","Songti TC","Noto Serif CJK TC",serif;--cjk:"Songti TC","Noto Serif CJK TC","Noto Serif TC","PingFang TC",serif;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#0d0b09;color:var(--ink);font-family:var(--cjk)}
/* ═ 舞台 16:9 ═ */
#stage{position:fixed;inset:0;display:grid;place-items:center}
#frame{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);overflow:hidden;background:var(--paper);
  background-image:
    radial-gradient(1400px 800px at 80% -10%,rgba(217,119,87,.12),transparent 60%),
    radial-gradient(900px 600px at 5% 15%,rgba(158,69,41,.06),transparent 64%),
    repeating-linear-gradient(72deg,transparent 0 30px,rgba(158,69,41,.05) 30px 31px,transparent 31px 62px,rgba(20,20,19,.03) 62px 63px,transparent 63px 128px),
    repeating-linear-gradient(-54deg,transparent 0 50px,rgba(20,20,19,.025) 50px 51px,transparent 51px 110px,rgba(217,119,87,.05) 110px 111px,transparent 111px 190px),
    linear-gradient(166deg,#FAF9F5,#F2F0E8 40%,#EDEAE0 72%,#F5F2EA)}
.layer{position:absolute;inset:0}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s var(--ease)}
.bg.on{opacity:1}
/* ═ 油畫層（Gamma 生成；右三分一留白畀文字）═ */
.art{position:absolute;inset:0;background-size:cover;background-position:left center;opacity:0;transition:opacity 1.1s var(--ease);transform:scale(1.04);}
.art.on{opacity:1;animation:kenburns 26s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1.04) translateX(0)}to{transform:scale(1.09) translateX(-1.5%)}}
.art::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(240,238,230,0) 0%,rgba(240,238,230,.08) 38%,rgba(240,238,230,.86) 56%,rgba(240,238,230,.96) 100%)}
.art.dark::after{background:linear-gradient(90deg,rgba(20,18,16,0) 0%,rgba(20,18,16,.15) 38%,rgba(30,26,22,.86) 56%,rgba(30,26,22,.95) 100%)}
#frame.with-art .slide{padding:6% 6% 8% 50%;align-items:flex-start;text-align:left}
#frame.with-art .slide .body{text-align:left;max-width:100%}
#frame.with-art .slide .rule{margin-left:0}
#frame.with-art .grid{justify-content:flex-start;max-width:100%}
#frame.with-art .st{min-width:18vh;padding:2.2vh 2.4vh}
#frame.with-art .opts{width:100%}
#frame.with-art .podium,#frame.with-art .wts,#frame.with-art .cmp{align-self:center}
#frame.dark-art{color:#F4EDE0}
#frame.dark-art .slide h1,#frame.dark-art .slide .body{color:#F4EDE0}
#frame.dark-art .slide .sub,#frame.dark-art .rank{color:#E8B48F}
#frame.dark-art .opt,#frame.dark-art .st,#frame.dark-art .row{background:rgba(40,34,30,.82);color:#F4EDE0;border-color:rgba(244,237,224,.14)}
#frame.dark-art #stagebar b,#frame.dark-art #foot{color:#F4EDE0}
/* ═ 常駐 overlay ═ */
#stagebar{position:absolute;left:3.2%;top:3.5%;font-family:var(--serif);font-size:1.6vh;color:var(--clay-deep);letter-spacing:.1em;opacity:.85;z-index:30;
  display:flex;gap:1.2vh;align-items:baseline}
#stagebar b{font-size:2vh;font-family:var(--cjk);color:var(--ink)}
#timer{position:absolute;right:3.2%;top:3.5%;font-family:var(--serif);font-size:3.6vh;font-weight:600;color:var(--clay-deep);z-index:30;
  font-variant-numeric:tabular-nums;opacity:0;transition:opacity .5s}
#timer.on{opacity:1}#timer.low{color:#B4332B;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
#foot{position:absolute;left:0;right:0;bottom:2.6%;text-align:center;font-family:var(--serif);font-size:1.5vh;color:var(--muted);letter-spacing:.14em;z-index:30}
#foot .dots{display:inline-flex;gap:.5vh;margin-left:1.5vh;vertical-align:middle}
#foot .dots i{width:.7vh;height:.7vh;border-radius:50%;background:rgba(20,20,19,.16)}
#foot .dots i.on{background:var(--clay);transform:scale(1.4)}
#pin{position:absolute;left:3.2%;bottom:2.6%;font-size:1.5vh;color:var(--clay-deep);z-index:30;opacity:0}
#pin.on{opacity:1}
/* ═ 投影片內容（fallback）═ */
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7% 9%;text-align:center}
.slide h1{font-family:var(--cjk);font-weight:600;color:var(--ink);letter-spacing:.12em;line-height:1.25}
.slide .sub{font-family:var(--serif);color:var(--clay-deep);font-style:italic}
.slide .body{font-family:var(--cjk);color:var(--ink2);white-space:pre-wrap;line-height:1.95;text-align:left;max-width:78%}
.slide .hint{margin-top:4vh;font-family:var(--cjk);font-size:2.6vh;color:var(--clay-deep);letter-spacing:.2em;
  border:1px solid rgba(158,69,41,.4);border-radius:999px;padding:1.2vh 4vh;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55;transform:scale(.98)}}
.rule{width:28vh;height:1px;background:linear-gradient(90deg,transparent,rgba(158,69,41,.6),transparent);margin:2.4vh auto}
/* ═ 入場動畫（按頁種類）═ */
.enter-fade{animation:fadeIn 1.2s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.enter-zoom{animation:zoomIn 1.1s var(--spring) both}
@keyframes zoomIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
.enter-turn{transform-origin:left center;animation:pageTurn 1.1s var(--ease) both}
@keyframes pageTurn{from{opacity:0;transform:perspective(2200px) rotateY(-38deg) translateX(-6%)}60%{opacity:1}to{opacity:1;transform:none}}
.enter-flash{animation:flashIn .9s var(--ease) both}
@keyframes flashIn{0%{opacity:0;filter:brightness(4)}12%{opacity:1;filter:brightness(3)}30%{filter:brightness(1)}100%{opacity:1}}
.enter-shake{animation:shake .8s var(--ease) both}
@keyframes shake{0%{transform:translate(0)}10%{transform:translate(-1.2%,.6%)}25%{transform:translate(1%,-.8%)}40%{transform:translate(-.8%,.5%)}55%{transform:translate(.6%,-.4%)}70%{transform:translate(-.3%,.2%)}100%{transform:none}}
.enter-mist{animation:mist 1.8s var(--ease) both}
@keyframes mist{from{opacity:0;filter:blur(18px)}to{opacity:1;filter:blur(0)}}
.enter-coins{animation:fadeIn 1s both}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:25}
.flash.go{animation:flashOnce .7s ease-out both}
@keyframes flashOnce{0%{opacity:.95}100%{opacity:0}}
/* 逐行浮現 */
.lines>*{opacity:0;animation:lineIn .8s var(--ease) forwards}
@keyframes lineIn{from{opacity:0;transform:translateY(1.6vh)}to{opacity:1;transform:none}}
/* 選站卡 */
.grid{display:flex;gap:2.4vh;flex-wrap:wrap;justify-content:center;margin-top:3vh;max-width:88%}
.st{background:rgba(255,254,250,.85);border:1px solid rgba(20,20,19,.1);border-radius:2.2vh;padding:3vh 3.4vh;min-width:22vh;
  box-shadow:0 .4vh 0 rgba(20,20,19,.08),0 2vh 5vh rgba(20,20,19,.08);opacity:0;animation:cardUp .7s var(--spring) forwards}
@keyframes cardUp{from{opacity:0;transform:translateY(6vh) scale(.94)}to{opacity:1;transform:none}}
.st .e{font-size:5.5vh}.st .n{font-family:var(--cjk);font-size:2.9vh;font-weight:600;margin-top:1vh}.st .t{font-size:1.9vh;color:var(--muted);margin-top:.6vh}
/* 選項 */
.opts{display:flex;flex-direction:column;gap:1.6vh;margin-top:3.4vh;width:64%}
.opt{background:rgba(255,254,250,.9);border:1px solid rgba(20,20,19,.1);border-radius:1.8vh;padding:2vh 3vh;font-family:var(--cjk);font-size:2.9vh;text-align:left;
  box-shadow:0 .4vh 0 rgba(20,20,19,.08);opacity:0;animation:cardUp .6s var(--spring) forwards}
/* 風暴雨線 */
.rain{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.55}
.rain i{position:absolute;top:-10%;width:2px;height:16vh;background:linear-gradient(180deg,transparent,rgba(67,105,143,.55));animation:drop 1.1s linear infinite}
@keyframes drop{to{transform:translateY(130vh)}}
/* 金幣 */
.coins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.coins i{position:absolute;top:-6vh;width:3.2vh;height:3.2vh;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F4CE7A,#C9962B 60%,#8a5f14);
  box-shadow:0 0 1.2vh rgba(201,150,43,.6);animation:coinFall 2.6s cubic-bezier(.4,0,.9,.6) both}
@keyframes coinFall{to{transform:translateY(120vh) rotate(720deg)}}
/* ═ 揭示 ═ */
.podium{display:flex;align-items:flex-end;gap:5vh;margin-top:4vh}
.pd{display:flex;flex-direction:column;align-items:center;opacity:0;animation:cardUp .9s var(--spring) forwards}
.pd .nm{font-family:var(--cjk);font-size:4.2vh;font-weight:600}.pd .sc{font-family:var(--serif);font-size:3vh;color:var(--clay-deep)}
.pd .base{margin-top:1.4vh;border-radius:1.2vh 1.2vh 0 0;display:grid;place-items:start center;padding-top:1vh;font-family:var(--serif);font-size:4vh;font-weight:700;color:rgba(20,20,19,.55)}
.pd1 .base{width:24vh;height:22vh;background:linear-gradient(180deg,#F4CE7A,#C9962B)}
.pd2 .base{width:20vh;height:15vh;background:linear-gradient(180deg,#e6edf2,#B9C3CA)}
.pd3 .base{width:20vh;height:11vh;background:linear-gradient(180deg,#dda87e,#B07A4E)}
.wts{display:flex;gap:2.6vh;margin-top:4vh}
.wt{perspective:1400px;width:15vh;height:19vh}
.wt .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.1s var(--ease)}
.wt.flip .in{transform:rotateY(180deg)}
.wt .f,.wt .k{position:absolute;inset:0;backface-visibility:hidden;border-radius:2vh;display:grid;place-items:center;font-family:var(--serif);font-size:4vh;font-weight:700;
  background:rgba(255,254,250,.94);border:1px solid rgba(20,20,19,.12);box-shadow:0 .4vh 0 rgba(20,20,19,.08),0 2vh 5vh rgba(20,20,19,.1)}
.wt .f{font-size:6vh}.wt .k{transform:rotateY(180deg);color:var(--clay-deep)}
.wt.blue .k{background:linear-gradient(160deg,#eaf1fb,#cfe0f5);color:#2c4f75;font-size:5vh;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 5vh rgba(67,105,143,.55)}}
.big{font-family:var(--cjk);font-size:9vh;font-weight:700;letter-spacing:.14em;opacity:0;animation:zoomIn 1.2s var(--spring) forwards}
.rank{font-family:var(--serif);font-size:5vh;color:var(--clay-deep);opacity:0;animation:fadeIn 1s .3s forwards}
.cmp{display:flex;gap:8vh;margin-top:4vh}
.col{display:flex;flex-direction:column;gap:1.4vh;min-width:30vh}
.col h3{font-family:var(--serif);font-size:2.6vh;color:var(--muted);letter-spacing:.14em;font-weight:500;text-align:center}
.row{background:rgba(255,254,250,.9);border:1px solid rgba(20,20,19,.1);border-radius:1.4vh;padding:1.5vh 2.4vh;font-family:var(--cjk);font-size:2.8vh;text-align:left;
  display:flex;gap:2vh;align-items:baseline;opacity:0;animation:cardUp .7s var(--spring) forwards}
.row b{font-family:var(--serif);color:var(--clay-deep);min-width:3.6vh}
.row.up{background:linear-gradient(160deg,#eaf1fb,#dbe8f7);border-color:rgba(67,105,143,.4)}
.row.up::after{content:"▲";color:#2c4f75;margin-left:auto}
.row.down::after{content:"▼";color:var(--muted);margin-left:auto}
/* Board overlay */
#board{position:absolute;inset:0;border:0;opacity:0;pointer-events:none;transition:opacity 1s var(--ease);z-index:40;background:#0B1F2A}
#board.on{opacity:1;pointer-events:auto}
#status{position:absolute;right:3.2%;bottom:2.6%;font-size:1.4vh;color:var(--muted);z-index:30;font-family:var(--serif)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <div class="art" id="artA"></div><div class="art" id="artB"></div>
  <div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>
  <div class="layer" id="content"></div>
  <div class="flash" id="flash"></div>
  <div id="stagebar"></div><div id="timer"></div><div id="pin">📌 已釘住（Esc 解除）</div>
  <div id="foot"></div><div id="status"></div>
  <iframe id="board" src="index.html"></iframe>
</div></div>
<script>
// ── ✏️ Lambda URL ──
const BASE = 'https://pw3jpvywrpggt73vova47hq3la0depya.lambda-url.ap-northeast-1.on.aws';
const SLIDES_DIR = 'slides/';        // Canva 匯出 PNG 放呢度：slides/S03_R1_sit.png；揭示：slides/S25_R6_reveal_p3.png
// ── 油畫底圖（Gamma 生成，油畫風、冇真人）。本地 art/<key>.jpg 優先，冇就用 CDN ──
const ART = {
  title:     'https://cdn.gamma.app/19d48kq1nk9ajho/design-anything/w45FHYVDICi0rL6IvZMKB/oAuyE85Qvmeh-fsA4Qv9W.jpg',
  R1:        'https://cdn.gamma.app/19d48kq1nk9ajho/design-anything/Zpl7w3d4eibJQR3BiJlgJ/AOtMEldZ5j0vlcchxBhuy.jpg',
  R2:        'https://cdn.gamma.app/19d48kq1nk9ajho/design-anything/jFe2CtDBY9xVTB7ZQHAwb/W5EVnvvXdLDcSF2fhCa-m.jpg',
  R3:        'https://cdn.gamma.app/19d48kq1nk9ajho/design-anything/HQTXPjIa6GRCK2xJ22jTw/lsQgxZmHsZ-RWdljNKWv-.jpg',
  R4:        'https://cdn.gamma.app/19d48kq1nk9ajho/design-anything/AGD9n2mEoA6lt4goOyq6Y/_AIyudbizQsd6TyJYKEpg.jpg',
  storm:     'https://cdn.gamma.app/19d48kq1nk9ajho/design-anything/20cGUrW2B6uaSYitmrfQi/j5xVZGdBmnIRHqGiSh9Y8.jpg',
  R6:        'https://cdn.gamma.app/19d48kq1nk9ajho/design-anything/CoNt8Fohv3H19oQf6nszI/oxjL8yELWU1A5HMJAHkxu.jpg',
  auction:   'https://cdn.gamma.app/19d48kq1nk9ajho/design-anything/X2Vszpvsk4bX10uYNH7M1/UJmOWYm0F2lbcv0-JMvl5.jpg',
  aftermath: 'https://cdn.gamma.app/19d48kq1nk9ajho/design-anything/KhzoSjztHkwqUs8JM17Q9/wmk5sPVRCJU4ou9IxaDG1.jpg',
  reveal:    'https://cdn.gamma.app/19d48kq1nk9ajho/design-anything/wu29JgtblK9KyP4Id3mYc/kSftVEHzUuWZx4zY4jS7C.jpg',
};
const DARK_ART = new Set(['storm', 'reveal']);   // 深色油畫 → 文字轉淺色
function artKeyFor(s, st) {
  if (s.kind === 'title') return 'title';
  if (s.kind === 'storm') return 'storm';
  if (s.kind === 'auction') return 'auction';
  if (s.kind === 'aftermath') return 'aftermath';
  if (s.kind === 'reveal') return 'reveal';
  if (s.round === 'R5') return s.kind === 'round' ? 'storm' : 'aftermath';
  if (s.round === 'R6') return 'R6';
  return s.round || 'title';
}
// ─────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
let CUR = null, LOCAL = null, PINNED = false, LAST = null, timerEnd = 0, timerTick = null, bgFlip = false;

const ENTER = { title: 'enter-fade', round: 'enter-zoom', choose: 'enter-fade', situation: 'enter-turn', event: 'enter-flash', aftermath: 'enter-mist', storm: 'enter-shake', auction: 'enter-coins', reveal: 'enter-fade' };
const TOK = [['green', '🟢', '事業'], ['red', '🔴', '關係'], ['purple', '🟣', '內在'], ['yellow', '🟡', '享樂'], ['blue', '🔵', '信仰']];

// ── 嘗試 Canva 底圖；冇就 fallback ──
function setBg(url) {
  const a = $('bgA'), b = $('bgB'); const next = bgFlip ? a : b, prev = bgFlip ? b : a; bgFlip = !bgFlip;
  if (!url) { next.classList.remove('on'); prev.classList.remove('on'); return Promise.resolve(false); }
  return new Promise(res => { const img = new Image(); img.onload = () => { next.style.backgroundImage = `url(${url})`; next.classList.add('on'); prev.classList.remove('on'); res(true); };
    img.onerror = () => { next.classList.remove('on'); prev.classList.remove('on'); res(false); }; img.src = url; });
}
let artFlip = false;
function loadImg(url) { return new Promise(res => { const i = new Image(); i.onload = () => res(true); i.onerror = () => res(false); i.src = url; }); }
async function setArt(key) {
  const a = $('artA'), b = $('artB'); const next = artFlip ? a : b, prev = artFlip ? b : a; artFlip = !artFlip;
  const local = 'art/' + key + '.jpg';
  const url = (await loadImg(local)) ? local : (ART[key] && await loadImg(ART[key]) ? ART[key] : null);
  if (!url) { next.classList.remove('on'); prev.classList.remove('on'); return false; }
  next.style.backgroundImage = `url(${url})`; next.classList.toggle('dark', DARK_ART.has(key)); next.classList.add('on'); prev.classList.remove('on');
  return true;
}
const stagger = (sel, base = .08) => document.querySelectorAll(sel).forEach((el, i) => el.style.animationDelay = (base * i + .15) + 's');

// ── 各頁 fallback HTML ──
function html(s, st) {
  const k = s.kind, rd = st.revealData || {}, rv = st.reveal || 0;
  if (k === 'title') return `<div class="slide"><div class="sub" style="font-size:3.4vh">${esc(s.body)}</div><div class="rule"></div><h1 style="font-size:9vh">${esc(s.title)}</h1><div class="rule"></div><div class="sub" style="font-size:2.4vh;letter-spacing:.3em">提摩太團契 · 秋令營 2026</div></div>`;
  if (k === 'round') return `<div class="slide lines"><div class="sub" style="font-size:3vh;letter-spacing:.3em">${esc(s.round)}</div><h1 style="font-size:11vh">${esc(s.title)}</h1><div class="sub" style="font-size:4vh">${esc(s.sub)}</div><div class="rule"></div><div class="body" style="font-size:3vh;text-align:center">${esc(s.body)}</div></div>`;
  if (k === 'choose') return `<div class="slide"><h1 style="font-size:6vh">${esc(s.title)}</h1><div class="sub" style="font-size:2.6vh;margin-top:1vh">${esc(s.sub)}</div>
    <div class="grid">${(s.items || []).map(it => `<div class="st"><div class="e">${it.emoji}</div><div class="n">${esc(it.name)}</div><div class="t">${esc(it.task)}</div></div>`).join('')}</div></div>`;
  if (['situation', 'event', 'aftermath'].includes(k)) return `<div class="slide"><div class="sub" style="font-size:2.4vh;letter-spacing:.3em">${k === 'situation' ? '📖 情境' : k === 'event' ? '⚡ 事件' : '🌫 風暴之後'}</div><h1 style="font-size:7vh;margin:1.2vh 0 2vh">${esc(s.title)}</h1>
    <div class="body lines" style="font-size:3vh">${esc(s.body).split('\n').filter(x => x.trim()).map(l => `<div>${l}</div>`).join('')}</div>
    <div class="opts">${(s.choices || []).map(c => `<div class="opt">${esc(c)}</div>`).join('')}</div><div class="hint">${esc(s.sub)}</div></div>`;
  if (k === 'storm') return `<div class="rain">${Array.from({ length: 60 }, (_, i) => `<i style="left:${(i * 1.7) % 100}%;animation-delay:${(i % 10) * .11}s;animation-duration:${.9 + (i % 5) * .12}s"></i>`).join('')}</div>
    <div class="slide lines"><h1 style="font-size:11vh">${esc(s.title)}</h1><div class="rule"></div><div class="body" style="font-size:3.2vh;text-align:center">${esc(s.body)}</div></div>`;
  if (k === 'auction') return `<div class="coins">${Array.from({ length: 28 }, (_, i) => `<i style="left:${(i * 3.6) % 100}%;animation-delay:${(i % 7) * .22}s"></i>`).join('')}</div>
    <div class="slide lines"><h1 style="font-size:10vh">${esc(s.title)}</h1><div class="rule"></div><div class="body" style="font-size:3.4vh;text-align:center">${esc(s.body)}</div></div>`;
  if (k === 'reveal') {
    if (rv <= 1) return `<div class="slide"><div class="big">遊戲完結</div><div class="rank">六個回合。一個人生。</div></div>`;
    if (rv === 2) { const p = rd.public3 || []; const pd = (x, c, m) => x ? `<div class="pd ${c}"><div class="nm">${esc(x.name)}</div><div class="sc">${x.n} 枚</div><div class="base">${m}</div></div>` : '';
      return `<div class="slide"><div class="sub" style="font-size:2.8vh;letter-spacing:.3em">公開榜 · 按代幣總數</div><div class="podium">${pd(p[1], 'pd2', 2)}${pd(p[0], 'pd1', 1)}${pd(p[2], 'pd3', 3)}</div></div>`; }
    if (rv === 3) { const w = rd.weights || {}; return `<div class="slide"><div class="big" style="font-size:6vh">但係——</div><div class="rank" style="font-size:2.8vh;letter-spacing:.3em">每種代幣，重量唔一樣</div>
      <div class="wts">${TOK.map(([k2, e, n]) => `<div class="wt ${k2 === 'blue' ? 'blue' : ''}" data-k="${k2}"><div class="in"><div class="f">${e}</div><div class="k">×${w[k2] ?? '?'}</div></div></div>`).join('')}</div></div>`; }
    if (rv >= 4 && rv <= 6) { const i = 6 - rv; const x = (rd.true3 || [])[i]; return `<div class="slide"><div class="rank">真榜 第 ${i + 1} 名</div><div class="big">${x ? esc(x.name) : '⋯'}</div><div class="rank" style="font-size:3.4vh">${x ? `${x.s} 分 · ${x.n} 枚` : ''}</div></div>`; }
    const c = rd.compare || { public: [], true: [] }; const pubIdx = Object.fromEntries(c.public.map((n, i) => [n, i]));
    return `<div class="slide"><div class="sub" style="font-size:2.6vh;letter-spacing:.3em">公開榜 vs 真榜</div><div class="cmp">
      <div class="col"><h3>公開榜</h3>${c.public.map((n, i) => `<div class="row"><b>${i + 1}</b>${esc(n)}</div>`).join('')}</div>
      <div class="col"><h3>真榜</h3>${c.true.map((n, i) => { const was = pubIdx[n]; const cls = was === undefined || was > i ? 'up' : was < i ? 'down' : ''; return `<div class="row ${cls}"><b>${i + 1}</b>${esc(n)}</div>`; }).join('')}</div></div></div>`;
  }
  return `<div class="slide"><h1 style="font-size:6vh">${esc(s.title)}</h1><div class="body" style="font-size:3vh">${esc(s.body)}</div></div>`;
}

async function show(st, force) {
  const s = st.slide; if (!s) return;
  const key = `${s.id}|${st.reveal}|${st.mode}`;
  if (!force && key === LAST) return; LAST = key;
  $('board').classList.toggle('on', st.mode === 'board');
  const bgUrl = SLIDES_DIR + s.id + (s.kind === 'reveal' ? `_p${st.reveal || 1}` : '') + '.png';
  const hasBg = await setBg(bgUrl);
  const artKey = artKeyFor(s, st);
  const hasArt = hasBg ? (setArt('__none__'), false) : await setArt(artKey);
  $('frame').classList.toggle('with-art', hasArt);
  $('frame').classList.toggle('dark-art', hasArt && DARK_ART.has(artKey));
  const c = $('content'); c.className = 'layer ' + (ENTER[s.kind] || 'enter-fade');
  if (s.kind === 'event') { $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go'); }
  c.innerHTML = hasBg && s.kind !== 'reveal' ? '' : html(s, st);   // 有 Canva 底圖就唔畫 fallback（揭示頁例外：數據要 overlay）
  if (hasBg && s.kind === 'reveal') c.querySelectorAll('.slide').forEach(el => el.style.background = 'transparent');
  stagger('.lines>*', .22); stagger('.st', .1); stagger('.opt', .14); stagger('.pd', .35); stagger('.row', .12);
  if (s.kind === 'reveal' && st.reveal === 3) setTimeout(() => document.querySelectorAll('.wt').forEach((el, i) => setTimeout(() => el.classList.add('flip'), 500 + i * 450)), 900);
  $('stagebar').innerHTML = s.stage?.stage ? `<span>${esc(s.round)}</span><b>${esc(s.stage.icon)} ${esc(s.stage.stage)}</b><span>${esc(s.stage.age)} · ${esc(s.stage.tag)}</span>` : '';
  const dots = Array.from({ length: s.total }, (_, i) => `<i class="${i === s.seq ? 'on' : ''}"></i>`).join('');
  $('foot').innerHTML = `${esc(s.id)}<span class="dots">${dots}</span>`;
  startTimer(s.timer);
}
function startTimer(sec) {
  clearInterval(timerTick); const t = $('timer');
  if (!sec) { t.classList.remove('on', 'low'); return; }
  timerEnd = Date.now() + sec * 1000; t.classList.add('on'); t.classList.remove('low');
  const tick = () => { const left = Math.max(0, Math.round((timerEnd - Date.now()) / 1000)); t.textContent = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`; if (left <= 15) t.classList.add('low'); if (left <= 0) clearInterval(timerTick); };
  tick(); timerTick = setInterval(tick, 500);
}
async function poll() {
  try { const r = await fetch(BASE + '/state', { cache: 'no-store' }); const st = await r.json(); CUR = st;
    $('status').textContent = `同步 ${new Date().toLocaleTimeString('zh-HK')}`;
    if (!PINNED) show(st);
  } catch { $('status').textContent = '連線唔到，重試中'; }
}
// 鍵盤：← → 本地翻頁（rehearsal）；P 釘住；Esc 解除
document.addEventListener('keydown', async e => {
  if (!CUR) return;
  if (e.key === 'p' || e.key === 'P') { PINNED = !PINNED; $('pin').classList.toggle('on', PINNED); return; }
  if (e.key === 'Escape') { PINNED = false; $('pin').classList.remove('on'); show(CUR, true); return; }
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    PINNED = true; $('pin').classList.add('on');
    const cur = LOCAL ?? CUR.slide.seq; const nxt = Math.max(0, Math.min(CUR.slide.total - 1, cur + (e.key === 'ArrowRight' ? 1 : -1)));
    LOCAL = nxt;
    try { const r = await fetch(BASE + '/state?seq=' + nxt, { cache: 'no-store' }); show(await r.json(), true); } catch {}
  }
  if (e.key === 'b' || e.key === 'B') $('board').classList.toggle('on');
});
poll(); setInterval(poll, 3000);
</script>
</body>
